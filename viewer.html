<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading… — Study Notes Hub</title>
<style>
:root{
  --bg:#f1f5f9;--cardbg:#ffffff;--ink:#0f172a;--muted:#64748b;
  --line:#e2e8f0;--acc:#0e7490;--acc2:#155e75;--chip:#e0f2fe;
  --tree:#f8fafc;--match:#fef9c3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Bengali",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}

/* ===== top bar ===== */
.bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--cardbg);border-bottom:1px solid var(--line);
  padding:10px 16px;flex:0 0 auto;
}
.back{
  text-decoration:none;color:var(--acc);font-weight:700;font-size:.88rem;
  border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:#fff;
  white-space:nowrap;
}
.back:hover{border-color:var(--acc)}
.tt{min-width:120px;flex:1 1 200px;line-height:1.25}
.tt .t{font-weight:700;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt .c{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--tree);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{
  border:none;border-radius:8px;padding:7px 13px;font-size:.84rem;font-weight:600;
  background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;
}
.seg button:hover{color:var(--acc)}
.seg button.on{background:var(--acc);color:#fff}
.fsz{display:flex;gap:4px}
.fsz button{
  border:1px solid var(--line);background:#fff;color:var(--acc2);cursor:pointer;
  border-radius:9px;width:34px;height:34px;font-weight:800;font-size:.85rem;
}
.fsz button:hover{border-color:var(--acc)}

/* ===== panes ===== */
#panes{flex:1 1 auto;min-height:0;display:flex;background:var(--bg)}
.pane{min-width:0;overflow-y:auto;height:100%;scroll-behavior:auto}
#srcpane{flex:1;display:none;background:#fbfdfe}
#outpane{flex:1;display:block}

/* read mode */
#panes.read #srcpane{display:none}
#panes.read #outpane{overflow-y:auto}

/* source mode */
#panes.source #outpane{display:none}
#panes.source #srcpane{display:block}
#srctxt{
  padding:22px 24px 90px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.85rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;tab-size:4;
  color:var(--ink);
}

/* split mode */
#panes.split #srcpane{display:block;border-right:1px solid var(--line)}
#panes.split #outpane{overflow-y:auto}

/* article (rendered markdown) */
article.sheet{
  max-width:920px;margin:20px auto 60px;background:var(--cardbg);
  border:1px solid var(--line);border-radius:14px;padding:30px 32px 40px;
  box-shadow:0 2px 10px rgba(2,6,23,.04);
}
article.sheet h1{font-size:1.5rem;letter-spacing:-.01em;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:18px}
article.sheet h2{font-size:1.22rem;margin:26px 0 10px;color:var(--acc2);border-bottom:1px solid var(--line);padding-bottom:6px}
article.sheet h3{font-size:1.05rem;margin:20px 0 8px}
article.sheet h4,article.sheet h5,article.sheet h6{font-size:.95rem;margin:16px 0 6px;color:var(--muted)}
article.sheet p{margin:8px 0}
article.sheet ul,article.sheet ol{margin:8px 0 8px 26px}
article.sheet li{margin:3px 0}
article.sheet hr{border:none;border-top:1px dashed var(--line);margin:22px 0}
article.sheet mark{background:var(--match);border-radius:3px;padding:0 2px}
article.sheet code{
  background:#eef2f7;border-radius:6px;padding:1px 6px;font-size:.87em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#0f172a;
  overflow-wrap:anywhere;
}
article.sheet pre.code{
  background:#0f172a;color:#e2e8f0;border-radius:12px;padding:14px 16px;
  overflow-x:auto;margin:12px 0;font-size:.83rem;line-height:1.55;
}
article.sheet pre.code code{background:none;color:inherit;padding:0}
article.sheet blockquote{
  border-left:4px solid var(--acc);background:var(--tree);color:#334155;
  border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;
}
article.sheet blockquote p{margin:4px 0}
.tblwrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px}
article.sheet table{border-collapse:collapse;width:100%;font-size:.88rem}
article.sheet th{background:var(--tree);color:var(--acc2);font-weight:700}
article.sheet th,article.sheet td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
article.sheet tbody tr:nth-child(even){background:#fafcff}
article.sheet img{max-width:100%;border-radius:10px}
article.sheet a{color:var(--acc);text-decoration:none}
article.sheet a:hover{text-decoration:underline}
article.sheet .wiki{color:var(--muted);border-bottom:1px dotted var(--muted)}
article.sheet input[type=checkbox]{accent-color:var(--acc);margin-right:6px}
article.sheet del{opacity:.65}

/* status / error */
#toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  background:#0f172a;color:#fff;font-size:.82rem;border-radius:999px;
  padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  max-width:90vw;text-align:center;
}
#toast.show{opacity:.92}
#errbox{
  display:none;margin:60px auto;max-width:520px;background:#fef2f2;border:1px solid #fca5a5;
  color:#7f1d1d;border-radius:14px;padding:22px;text-align:center;
}
#errbox h2{font-size:1rem;margin-bottom:8px}
#errbox p{font-size:.86rem;margin-bottom:14px;overflow-wrap:anywhere}
#errbox button,#errbox a{
  display:inline-block;margin:4px;padding:8px 14px;border-radius:10px;font-size:.84rem;
  cursor:pointer;text-decoration:none;font-weight:600;
}
#errbox button{border:1px solid #fca5a5;background:#fff;color:#7f1d1d}
#errbox a{background:#b91c1c;color:#fff;border:1px solid #b91c1c}

@media (max-width:760px){
  .bar{padding:8px 10px;gap:8px}
  #panes.split{flex-direction:column}
  #panes.split #srcpane{height:50%;flex:none;border-right:none;border-bottom:1px solid var(--line)}
  #panes.split #outpane{height:50%;flex:none}
  article.sheet{margin:12px 10px 40px;padding:20px 16px 30px}
  #srctxt{padding:16px}
}
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="index.html">← Hub</a>
  <div class="tt"><div class="t" id="doctitle">Loading…</div><div class="c" id="crumb"></div></div>
  <div class="seg" id="modeseg">
    <button data-mode="read" title="Rendered only">📖 Read</button>
    <button data-mode="split" title="Source + preview with synced scrolling">⇔ Split</button>
    <button data-mode="source" title="Markdown source">&lt;/&gt; Source</button>
  </div>
  <div class="fsz">
    <button id="fsminus" title="Smaller text">A−</button>
    <button id="fsplus" title="Bigger text">A+</button>
  </div>
</header>

<main id="panes" class="read">
  <section class="pane" id="srcpane"><pre id="srctxt"></pre></section>
  <section class="pane" id="outpane"><article class="sheet" id="mdout"></article></section>
</main>

<div id="toast"></div>

<div id="errbox">
  <h2>Could not load this note</h2>
  <p id="errmsg"></p>
  <button onclick="loadDoc()">Retry</button>
  <a id="ghlink" target="_blank" rel="noopener">Open on GitHub</a>
</div>

<script id="mdengine">
function mdEsc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function mdInline(t){
  const codes=[];
  t=t.replace(/%%[\s\S]*?%%/g,"");
  t=t.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return "\u0000C"+(codes.length-1)+"\u0000";});
  t=mdEsc(t);
  t=t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>'<span class="wiki">'+(b||a)+"</span>");
  t=t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,'<img alt="$1" loading="lazy" src="$2">');
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,"$1<em>$2</em>");
  t=t.replace(/~~([^~]+)~~/g,"<del>$1</del>");
  t=t.replace(/==([^=]+)==/g,"<mark>$1</mark>");
  return t.replace(/\u0000C(\d+)\u0000/g,(m,i)=>"<code>"+codes[i]+"</code>");
}
function mdParse(lines){
  const out=[];let i=0,m;
  while(i<lines.length){
    const L=lines[i];
    if(!L.trim()){i++;continue;}
    if(m=L.match(/^(`{3,}|~{3,})\s*([^`]*)$/)){
      const f=m[1][0];i++;const buf=[];
      while(i<lines.length&&!lines[i].trim().startsWith(f.repeat(3))){buf.push(lines[i]);i++;}
      i++;
      out.push({t:"code",v:buf.join("\n")});continue;
    }
    if(m=L.match(/^(#{1,6})\s+(.*)$/)){out.push({t:"h",lv:m[1].length,v:m[2].trim()});i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)){out.push({t:"hr"});i++;continue;}
    if(/^\s*>/.test(L)){
      const buf=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,""));i++;}
      out.push({t:"quote",v:mdParse(buf).map(mdRender).join("")});continue;
    }
    if(/^\s*\|/.test(L)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])&&/-/.test(lines[i+1])){
      const rows=[L,lines[i+1]];i+=2;
      while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      out.push({t:"table",rows});continue;
    }
    if(/^(\s*)([-*+]|\d+[.)])(\s|$)/.test(L)){
      const items=[];
      while(i<lines.length){
        const mm=lines[i].match(/^(\s*)([-*+]|\d+[.)])(\s+(.*))?$/);
        if(mm){
          items.push({ind:mm[1].replace(/\t/g,"  ").length,ord:/\d/.test(mm[2]),parts:[mm[4]||""]});i++;
        }else if(/^\s{2,}\S/.test(lines[i])&&items.length){
          items[items.length-1].parts.push(lines[i].trim());i++;
        }else if(!lines[i].trim()){
          if(i+1<lines.length&&/^\s{2,}\S/.test(lines[i+1])){i++;continue;}
          break;
        }else break;
      }
      out.push({t:"list",items});continue;
    }
    const buf=[];
    while(i<lines.length&&lines[i].trim()&&
      !/^#{1,6}\s|^\s*>|^\s*([-*+]|\d+[.)])(\s|$)|^\s*\||^(`{3,}|~{3,})|^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])){
      buf.push(lines[i]);i++;
    }
    if(buf.length)out.push({t:"p",v:buf});else i++;
  }
  return out;
}
function mdListItem(it){
  let txt=it.parts.join("\n");
  const tm=txt.match(/^\[([ xX])\]\s*([\s\S]*)$/);
  if(tm)txt='<input type="checkbox" disabled'+(tm[1]!==" "?" checked":"")+">"+tm[2];
  return mdInline(txt).replace(/\n/g,"<br>");
}
function mdListHtml(items){
  const base=items[0].ind,ord=items[0].ord;
  let h="",k=0;
  while(k<items.length){
    let j=k+1;const kids=[];
    while(j<items.length&&items[j].ind>base){kids.push(items[j]);j++;}
    h+="<li>"+mdListItem(items[k])+(kids.length?mdListHtml(kids):"")+"</li>";
    k=j;
  }
  return ord?"<ol>"+h+"</ol>":"<ul>"+h+"</ul>";
}
function mdTable(rows){
  const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const aligns=cells(rows[1]).map(a=>{
    const l=a.startsWith(":"),r=a.endsWith(":");
    if(l&&r)return ' style="text-align:center"';
    if(r)return ' style="text-align:right"';
    return "";
  });
  const head=cells(rows[0]);
  let h='<div class="tblwrap"><table><thead><tr>'+
    head.map((c,k)=>"<th"+(aligns[k]||"")+">"+mdInline(c)+"</th>").join("")+"</tr></thead><tbody>";
  for(let r=2;r<rows.length;r++){
    h+="<tr>"+cells(rows[r]).map((c,k)=>"<td"+(aligns[k]||"")+">"+mdInline(c)+"</td>").join("")+"</tr>";
  }
  return h+"</tbody></table></div>";
}
function mdRender(b){
  switch(b.t){
    case"h":return "<h"+b.lv+">"+mdInline(b.v)+"</h"+b.lv+">";
    case"hr":return "<hr>";
    case"code":return '<pre class="code">'+mdEsc(b.v)+"</pre>";
    case"quote":return "<blockquote>"+b.v+"</blockquote>";
    case"table":return mdTable(b.rows);
    case"list":return mdListHtml(b.items);
    default:return "<p>"+b.v.map(mdInline).join("<br>")+"</p>";
  }
}
function mdToHtml(src){
  src=src.replace(/\r\n?/g,"\n");
  if(/^---[ \t]*\n[\s\S]*?\n---[ \t]*(\n|$)/.test(src))src=src.replace(/^---[ \t]*\n[\s\S]*?\n---[ \t]*\n?/,"");
  return mdParse(src.split("\n")).map(mdRender).join("\n");
}
</script>

<script>
const REPO="anikmahmud2003/notes";
const BRANCH="main";
const RAWBASE="https://raw.githubusercontent.com/"+REPO+"/"+BRANCH+"/";
const enc=p=>p.split("/").map(encodeURIComponent).join("/");
const params=new URLSearchParams(location.search);
let FILE=params.get("file")||"";
FILE=FILE.replace(/\\/g,"/").replace(/^\/+/,"");

const panes=document.getElementById("panes");
const srcPane=document.getElementById("srcpane");
const outPane=document.getElementById("outpane");
const srctxt=document.getElementById("srctxt");
const mdout=document.getElementById("mdout");
const toast=document.getElementById("toast");
const errbox=document.getElementById("errbox");

function toastMsg(s){
  toast.textContent=s;toast.classList.add("show");
  clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove("show"),2200);
}
function prettyName(f){
  let n=f.split("/").pop().replace(/\.md$/i,"").replace(/[_]+/g," ").trim();
  return n||"Untitled";
}
function setMode(mode,silent){
  panes.className=mode;
  document.querySelectorAll("#modeseg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
  try{localStorage.setItem("note-viewer-mode",mode);}catch(e){}
  if(!silent&&mode==="split")syncFrom(outPane,true);
}
document.getElementById("modeseg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(b)setMode(b.dataset.mode);
});

/* font size */
function fsDelta(d){
  const cur=parseFloat(getComputedStyle(mdout).fontSize)||16;
  const next=Math.min(22,Math.max(13,cur+d));
  mdout.style.fontSize=next+"px";
  try{localStorage.setItem("note-viewer-fs",next);}catch(e){}
}
document.getElementById("fsplus").onclick=()=>fsDelta(1);
document.getElementById("fsminus").onclick=()=>fsDelta(-1);

/* ===== synced scrolling (split mode) ===== */
let lock=false;
function syncFrom(el,force){
  if(panes.className!=="split")return;
  if(lock&&!force)return;
  lock=true;
  const dst=(el===outPane)?srcPane:outPane;
  const eMax=el.scrollHeight-el.clientHeight;
  const dMax=dst.scrollHeight-dst.clientHeight;
  if(eMax>0&&dMax>0)dst.scrollTop=(el.scrollTop/eMax)*dMax;
  requestAnimationFrame(()=>{lock=false;});
}
outPane.addEventListener("scroll",()=>syncFrom(outPane,false),{passive:true});
srcPane.addEventListener("scroll",()=>syncFrom(srcPane,false),{passive:true});

/* ===== loading ===== */
async function fetchText(url){
  const r=await fetch(url);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();
  if(/^\s*</.test(t))throw new Error("not plain text");
  return t;
}
async function loadDoc(){
  errbox.style.display="none";
  if(!FILE){
    document.getElementById("doctitle").textContent="No file specified";
    document.getElementById("errmsg").textContent='Add ?file=Path/To/Note.md to the URL, e.g. viewer.html?file='+encodeURIComponent("README.md");
    document.getElementById("ghlink").href="https://github.com/"+REPO;
    errbox.style.display="block";return;
  }
  document.getElementById("ghlink").href="https://github.com/"+REPO+"/blob/"+BRANCH+"/"+enc(FILE);
  document.getElementById("doctitle").textContent=prettyName(FILE)+"  ·  loading…";
  document.getElementById("crumb").textContent=FILE.includes("/")?FILE.slice(0,FILE.lastIndexOf("/")):"repo root";
  document.title=prettyName(FILE)+" — Study Notes";
  let savedFs=null;try{savedFs=parseFloat(localStorage.getItem("note-viewer-fs")); }catch(e){}
  if(savedFs)mdout.style.fontSize=savedFs+"px";
  let text=null,err=null;
  for(const url of [enc(FILE),RAWBASE+enc(FILE)]){
    try{text=await fetchText(url);break;}catch(e){err=e;}
  }
  if(text===null){
    document.getElementById("errmsg").textContent=FILE+" — "+(err&&err.message?err.message:"fetch failed");
    errbox.style.display="block";
    document.getElementById("doctitle").textContent=prettyName(FILE)+"  ·  failed";
    return;
  }
  srctxt.textContent=text;
  mdout.innerHTML=mdToHtml(text);
  document.getElementById("doctitle").textContent=prettyName(FILE);
  let mode="read";try{mode=localStorage.getItem("note-viewer-mode")||"read";}catch(e){}
  setMode(mode,true);
  outPane.scrollTop=0;srcPane.scrollTop=0;
}
loadDoc();
</script>
</body>
</html>
