<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Common NCDs in Bangladesh and why they are increasing">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#0E7C7B"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q3 · Common NCDs in Bangladesh</text>
  <text x="29" y="56" font-size="13" fill="#bde1e0">Seven big NCDs 🌏 + why the NCD burden is rising 📈</text>

  <text x="28" y="90" font-size="15" font-weight="bold" fill="#0E7C7B">🌏 Common NCDs prevalent in Bangladesh</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="28"  y="98" width="176" height="54" rx="10" fill="#EBF5FB" stroke="#2980B9"/><text x="116" y="122" fill="#1F618D">❤️ Cardiovascular</text><text x="116" y="140" fill="#1F618D">diseases</text>
    <rect x="216" y="98" width="176" height="54" rx="10" fill="#EBF5FB" stroke="#2980B9"/><text x="304" y="122" fill="#1F618D">🧠 Cerebrovascular</text><text x="304" y="140" fill="#1F618D">(TIA / stroke)</text>
    <rect x="404" y="98" width="176" height="54" rx="10" fill="#FDECEC" stroke="#C0392B"/><text x="492" y="122" fill="#922B21">🍬 Diabetes mellitus</text>
    <rect x="592" y="98" width="176" height="54" rx="10" fill="#F4ECF7" stroke="#8E44AD"/><text x="680" y="122" fill="#6C3483">🧬 Cancer</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="28"  y="160" width="176" height="54" rx="10" fill="#FEF9E7" stroke="#F39C12"/><text x="116" y="184" fill="#9C640C">🗣 Mental illness</text>
    <rect x="216" y="160" width="176" height="54" rx="10" fill="#F4F6F7" stroke="#95A5A6"/><text x="304" y="184" fill="#5D6D7E">👁 Blindness</text>
    <rect x="404" y="160" width="176" height="54" rx="10" fill="#EAFAF1" stroke="#27AE60"/><text x="492" y="184" fill="#1E8449">🚑 Accidents</text>
    <rect x="592" y="160" width="176" height="54" rx="8" fill="#0E7C7B" fill-opacity="0.08"/><text x="680" y="177" fill="#09514F">CVD = CHD/IHD +</text><text x="680" y="195" fill="#09514F">HTN + RHD</text>
  </g>

  <rect x="28" y="232" width="744" height="40" rx="8" fill="#F4F6F7" stroke="#95A5A6"/>
  <text x="46" y="257" font-size="13" fill="#5D6D7E">📈 <tspan font-weight="bold">Impact:</tspan> loss of life → disability → family hardship → poverty → economic loss of the country</text>

  <text x="28" y="296" font-size="15" font-weight="bold" fill="#0E7C7B">🔍 Why NCDs are increasing in Bangladesh</text>
  <g font-size="12.5">
    <rect x="28" y="306" width="364" height="78" rx="10" fill="#FDECEC" stroke="#C0392B"/>
    <text x="44" y="330" font-weight="bold" fill="#922B21">🍔 Lifestyle &amp; behaviour</text>
    <text x="44" y="350" fill="#7b241c">Rapid change of food habit,</text>
    <text x="44" y="368" fill="#7b241c">life-style &amp; behavioural pattern</text>

    <rect x="404" y="306" width="368" height="78" rx="10" fill="#FDECEC" stroke="#C0392B"/>
    <text x="420" y="330" font-weight="bold" fill="#922B21">👵 Aging population</text>
    <text x="420" y="350" fill="#7b241c">Increasing proportion of adults</text>
    <text x="420" y="368" fill="#7b241c">&amp; elderly — NCDs = diseases of aging</text>

    <rect x="28" y="392" width="364" height="78" rx="10" fill="#FDECEC" stroke="#C0392B"/>
    <text x="44" y="416" font-weight="bold" fill="#922B21">🏭 Urbanization &amp; industrialization</text>
    <text x="44" y="436" fill="#7b241c">Sedentary occupations, stress,</text>
    <text x="44" y="454" fill="#7b241c">environmental pollution</text>

    <rect x="404" y="392" width="368" height="78" rx="10" fill="#FDECEC" stroke="#C0392B"/>
    <text x="420" y="416" font-weight="bold" fill="#922B21">🏥 Poor preventive care</text>
    <text x="420" y="436" fill="#7b241c">Failure / inability to obtain preventive</text>
    <text x="420" y="454" fill="#7b241c">health services (HTN, cancer, DM)</text>
  </g>

  <rect x="28" y="486" width="744" height="54" rx="10" fill="#0E7C7B" fill-opacity="0.08"/>
  <text x="46" y="509" font-size="13" font-weight="bold" fill="#09514F">🎯 Common NCD in BD = CVD + cerebrovascular + DM + cancer + mental illness + blindness + accidents</text>
  <text x="46" y="528" font-size="12.5" fill="#0E7C7B">Increasing due to demographic &amp; epidemiological transition + lifestyle change + aging + urbanization</text>
</svg>