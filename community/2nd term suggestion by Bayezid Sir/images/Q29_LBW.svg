<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Low birth weight definition, causes and importance with growth chart and GOBI-FFF">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#6D4C41"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q29 · Low Birth Weight (LBW) 👶⚖️</text>
  <text x="29" y="56" font-size="13" fill="#f3e5dc">Definition · causes · importance · complications · Road-to-Health · GOBI-FFF</text>

  <rect x="28" y="82" width="744" height="40" rx="10" fill="#FBE9E7" stroke="#BF360C" stroke-width="2"/>
  <text x="46" y="100" font-size="12.5" fill="#A93226" font-weight="bold">🔴 LBW = birth weight less than 2.5 kg, taken within one hour of birth</text>
  <text x="46" y="116" font-size="11.5" fill="#7b241c">Types: pre-term (&lt;37 wks) + small-for-date (SFD) · VLBW &lt;1500 g</text>

  <text x="28" y="138" font-size="14" font-weight="bold" fill="#6D4C41">🏗 Causes of LBW (5 groups)</text>
  <g font-size="11.5">
    <rect x="28" y="146" width="142" height="54" rx="9" fill="#FBE9E7" stroke="#BF360C"/><text x="99" y="165" fill="#A93226" font-weight="bold" text-anchor="middle">Maternal 🤰</text><text x="99" y="182" fill="#7b241c" text-anchor="middle">malnutrition, anaemia,</text><text x="99" y="196" fill="#7b241c" text-anchor="middle">PRIMI, HTN, toxaemia</text>
    <rect x="178" y="146" width="142" height="54" rx="9" fill="#FFF3E0" stroke="#EF6C00"/><text x="249" y="165" fill="#E65100" font-weight="bold" text-anchor="middle">Obstetric 🩺</text><text x="249" y="182" fill="#a04000" text-anchor="middle">APH, twin gestation,</text><text x="249" y="196" fill="#a04000" text-anchor="middle">abruptio placentae</text>
    <rect x="328" y="146" width="142" height="54" rx="9" fill="#FFF8E1" stroke="#F9A825"/><text x="399" y="165" fill="#F57F17" font-weight="bold" text-anchor="middle">Uterine 🏛</text><text x="399" y="182" fill="#8d6e00" text-anchor="middle">uterine anomaly,</text><text x="399" y="196" fill="#8d6e00" text-anchor="middle">large placenta</text>
    <rect x="478" y="146" width="142" height="54" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="549" y="165" fill="#922B21" font-weight="bold" text-anchor="middle">Foetal 👶</text><text x="549" y="182" fill="#7b241c" text-anchor="middle">chromosomal defect,</text><text x="549" y="196" fill="#7b241c" text-anchor="middle">congenital anomaly</text>
    <rect x="628" y="146" width="144" height="54" rx="9" fill="#F4ECF7" stroke="#8E44AD"/><text x="700" y="165" fill="#6C3483" font-weight="bold" text-anchor="middle">Social 👪</text><text x="700" y="182" fill="#6C3483" text-anchor="middle">low income, short</text><text x="700" y="196" fill="#6C3483" text-anchor="middle">interval, smoking</text>
  </g>

  <text x="28" y="218" font-size="14" font-weight="bold" fill="#6D4C41">🔥 Public health importance</text>
  <g font-size="11.5">
    <rect x="28" y="226" width="130" height="46" rx="9" fill="#FBE9E7" stroke="#BF360C"/><text x="93" y="244" fill="#A93226" font-weight="bold" text-anchor="middle">IMR 20× higher</text><text x="93" y="260" fill="#7b241c" text-anchor="middle">vs normal-weight</text>
    <rect x="166" y="226" width="130" height="46" rx="9" fill="#FBE9E7" stroke="#BF360C"/><text x="231" y="244" fill="#A93226" font-weight="bold" text-anchor="middle">Single most</text><text x="231" y="260" fill="#7b241c" text-anchor="middle">important survival factor</text>
    <rect x="304" y="226" width="130" height="46" rx="9" fill="#FBE9E7" stroke="#BF360C"/><text x="369" y="244" fill="#A93226" font-weight="bold" text-anchor="middle">Reflects mother's</text><text x="369" y="260" fill="#7b241c" text-anchor="middle">health &amp; nutrition</text>
    <rect x="442" y="226" width="130" height="46" rx="9" fill="#FBE9E7" stroke="#BF360C"/><text x="507" y="244" fill="#A93226" font-weight="bold" text-anchor="middle">Guide to level of</text><text x="507" y="260" fill="#7b241c" text-anchor="middle">care needed</text>
    <rect x="580" y="226" width="192" height="46" rx="9" fill="#FDEDEC" stroke="#C0392B"/><text x="676" y="244" fill="#922B21" font-weight="bold" text-anchor="middle">⚠️ Complications</text><text x="676" y="260" fill="#7b241c" text-anchor="middle">atelectasis · malformation · pulm. haemorrhage · intracranial bleed · infection</text>
  </g>

  <text x="28" y="290" font-size="14" font-weight="bold" fill="#6D4C41">📈 Road-to-Health (growth chart · Morley/WHO)</text>
  <g>
    <rect x="92" y="296" width="8" height="112" fill="#5D4037"/>
    <rect x="92" y="404" width="8" height="6" fill="#5D4037"/>
    <rect x="92" y="404" width="620" height="6" fill="#5D4037"/>
    <polygon points="92,399 682,336 682,404 92,404" fill="#C5E1A5"/>
    <polygon points="92,338 682,290 682,336 682,310 92,338" fill="#64DD17" opacity="0.0"/>
    <polygon points="682,290 692,290 682,336" fill="#5D4037"/>
    <rect x="92" y="338" width="590" height="1" fill="#2E7D32" opacity="0.35"/>
    <rect x="92" y="372" width="590" height="1" fill="#2E7D32" opacity="0.35" stroke-dasharray="6 4" stroke="#C62828"/>
    <rect x="92" y="399" width="590" height="1" fill="#2E7D32" opacity="0.35"/>
    <text x="96" y="332" font-size="10" fill="#2E7D32" font-weight="bold">Upper = 50th %ile boys</text>
    <text x="96" y="366" font-size="10" fill="#C62828" font-weight="bold">Middle = 3rd %ile girls</text>
    <text x="96" y="395" font-size="10" fill="#2E7D32" font-weight="bold">Lower = 60% of 50th %ile</text>
    <ellipse cx="508" cy="356" rx="16" ry="10" fill="#ffffff" stroke="#C62828" stroke-width="2"/>
    <text x="508" y="360" font-size="9" fill="#C62828" font-weight="bold" text-anchor="middle">😊 child</text>
    <text x="96" y="414" font-size="10" fill="#5D4037">1st degree malnutrition 75–89% (around middle) · 2nd degree 60–74% (middle→lower) · 3rd degree &lt;60% (below lower)</text>
  </g>

  <rect x="28" y="424" width="744" height="24" rx="8" fill="#EAFAF1" stroke="#27AE60"/>
  <text x="46" y="441" font-size="11.5" fill="#1E8449">🛡 <tspan font-weight="bold" fill="#145A32">Prevention:</tspan> more food + iron/folate · control infection · treat toxaemia/HTN · FP spacing · no smoking · better sanitation · educate girls</text>

  <rect x="28" y="456" width="744" height="48" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
  <text x="46" y="474" font-size="14">🎯 <tspan font-weight="bold" fill="#6C3483">GOBI-FFF</tspan> <tspan fill="#6C3483">=</tspan></text>
  <text x="46" y="492" font-size="11.5" fill="#5B2C6F"><tspan font-weight="bold">G</tspan>rowth monitoring · <tspan font-weight="bold">O</tspan>ral rehydration · <tspan font-weight="bold">B</tspan>reast feeding · <tspan font-weight="bold">I</tspan>mmunization · <tspan font-weight="bold">F</tspan>emale education · <tspan font-weight="bold">F</tspan>ood supplementation · <tspan font-weight="bold">F</tspan>amily spacing (was GOBI → now GOBI-FFF)</text>

  <rect x="28" y="516" width="744" height="32" rx="8" fill="#6D4C41" fill-opacity="0.08"/>
  <text x="46" y="537" font-size="12.5" font-weight="bold" fill="#3E2723">🎯 LBW = &lt;2.5 kg at birth · IMR 20× higher · causes = maternal+obstetric+uterine+foetal+social · Road-to-Health = space between 50th &amp; 3rd %ile lines!</text>
</svg>