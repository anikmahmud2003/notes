<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Five stages of demographic cycle and Bangladesh position">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#34495E"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q22 · Demographic Cycle 🔄</text>
  <text x="29" y="56" font-size="13" fill="#b7c8dc">5 stages · birth vs death rates · where is Bangladesh?</text>

  <g font-size="11.5">
    <rect x="28" y="90" width="142" height="72" rx="9" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="99" y="108" fill="#1F618D" font-weight="bold" text-anchor="middle">1 · High Stationary</text>
    <text x="99" y="126" fill="#21618C" text-anchor="middle">BR high · DR high</text>
    <text x="99" y="142" fill="#21618C" text-anchor="middle">Population: ➖ steady</text>

    <rect x="178" y="90" width="142" height="72" rx="9" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="249" y="108" fill="#9C640C" font-weight="bold" text-anchor="middle">2 · Early Expanding</text>
    <text x="249" y="126" fill="#7E5109" text-anchor="middle">BR high · DR ↓</text>
    <text x="249" y="142" fill="#7E5109" text-anchor="middle">Population: ↑↑ fast</text>

    <rect x="328" y="90" width="142" height="72" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2.5"/>
    <text x="399" y="108" fill="#922B21" font-weight="bold" text-anchor="middle">🇧🇩 3 · Late Expanding</text>
    <text x="399" y="126" fill="#7b241c" text-anchor="middle">BR ↓ · DR ↓↓</text>
    <text x="399" y="142" fill="#7b241c" text-anchor="middle">Population: ↑ still</text>

    <rect x="478" y="90" width="142" height="72" rx="9" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="549" y="108" fill="#1E8449" font-weight="bold" text-anchor="middle">4 · Low Stationary</text>
    <text x="549" y="126" fill="#145A32" text-anchor="middle">BR low · DR low</text>
    <text x="549" y="142" fill="#145A32" text-anchor="middle">Population: ➖ steady</text>

    <rect x="628" y="90" width="144" height="72" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="700" y="108" fill="#6C3483" font-weight="bold" text-anchor="middle">5 · Declining</text>
    <text x="700" y="126" fill="#6C3483" text-anchor="middle">BR &lt; DR (both low)</text>
    <text x="700" y="142" fill="#6C3483" text-anchor="middle">Population: 📉 down</text>
  </g>

  <text x="28" y="188" font-size="15" font-weight="bold" fill="#34495E">📈 Birth rate vs Death rate across the 5 stages</text>

  <line x1="80" y1="408" x2="740" y2="408" stroke="#5D6D7E" stroke-width="2"/>
  <line x1="80" y1="408" x2="80" y2="200" stroke="#5D6D7E" stroke-width="2"/>
  <text x="70" y="196" font-size="11" fill="#5D6D7E" font-weight="bold" text-anchor="end">Rate /1000</text>
  <text x="70" y="230" font-size="10" fill="#95A5A6" text-anchor="end">50</text>
  <text x="75" y="318" font-size="10" fill="#95A5A6" text-anchor="end">25</text>
  <text x="75" y="408" font-size="10" fill="#95A5A6" text-anchor="end">0</text>
  <line x1="80" y1="230" x2="740" y2="230" stroke="#D5DBDB"/><line x1="80" y1="318" x2="740" y2="318" stroke="#D5DBDB"/>

  <g font-size="11">
    <circle cx="120" cy="216" r="5" fill="#C0392B"/><text x="120" y="200" fill="#C0392B" font-weight="bold" text-anchor="middle">St 1</text>
    <circle cx="270" cy="227" r="5" fill="#C0392B"/>
    <circle cx="420" cy="253.5" r="5" fill="#C0392B"/>
    <circle cx="570" cy="337" r="5" fill="#C0392B"/>
    <circle cx="720" cy="352" r="5" fill="#C0392B"/><text x="720" y="200" fill="#C0392B" font-weight="bold" text-anchor="middle">St 5</text>
    <polyline points="120,216 270,227 420,253.5 570,337 720,352" fill="none" stroke="#C0392B" stroke-width="2.5"/>

    <circle cx="120" cy="238" r="5" fill="#2980B9"/><text x="100" y="426" fill="#2980B9" text-anchor="middle">DR</text>
    <circle cx="270" cy="322" r="5" fill="#2980B9"/>
    <circle cx="420" cy="344.8" r="5" fill="#2980B9"/>
    <circle cx="570" cy="356.2" r="5" fill="#2980B9"/>
    <circle cx="720" cy="344.8" r="5" fill="#2980B9"/>
    <polyline points="120,238 270,322 420,344.8 570,356.2 720,344.8" fill="none" stroke="#2980B9" stroke-width="2.5"/>

    <text x="200" y="440" fill="#C0392B" font-weight="bold">— Birth Rate (falls gradually)</text>
    <text x="200" y="460" fill="#2980B9" font-weight="bold">— Death Rate (falls then stabilises)</text>

    <ellipse cx="420" cy="290" rx="120" ry="95" fill="none" stroke="#F39C12" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="420" y="196" fill="#9C640C" font-weight="bold" text-anchor="middle">🇧🇩 Bangladesh = Stage 3</text>
    <text x="420" y="212" fill="#9C640C" font-size="10.5" text-anchor="middle">births still exceed deaths → growing</text>
  </g>

  <rect x="28" y="472" width="744" height="44" rx="10" fill="#F4F6F7" stroke="#95A5A6"/>
  <text x="46" y="492" font-size="12" fill="#5D6D7E">Examples: St-1 India (till 1920) · St-2 South Asia &amp; Africa · St-3 🇧🇩 Bangladesh/India/China</text>
  <text x="46" y="508" font-size="12" fill="#5D6D7E">St-4 UK/Denmark · St-5 Germany/Hungary (E. Europe)</text>

  <rect x="28" y="530" width="744" height="18" rx="6" fill="#34495E" fill-opacity="0.08"/>
  <text x="46" y="543" font-size="11.5" font-weight="bold" fill="#2C3E50">🎯 Stages 1→5: High stationary → Early expanding → Late expanding → Low stationary → Declining · BD = Stage 3</text>
</svg>