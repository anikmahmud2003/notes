<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Water purification large scale and small scale and chlorination">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#558B2F"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q48 · Water Purification &amp; Chlorination 🚰</text>
  <text x="29" y="56" font-size="13" fill="#e8efd8">Large-scale · small-scale · chlorination chemistry &amp; principles</text>

  <text x="28" y="84" font-size="13.5" font-weight="bold" fill="#558B2F">🏭 Large-scale purification — 3 steps</text>
  <g font-size="11">
    <rect x="28" y="92" width="240" height="150" rx="9" fill="#E8F5E9" stroke="#43A047"/>
    <text x="148" y="112" fill="#1B5E20" font-weight="bold" text-anchor="middle">1 · Storage 🏊</text>
    <text x="44" y="130" fill="#2E7D32">~90% suspended impurities settle</text>
    <text x="44" y="144" fill="#2E7D32">in 24 h · aerobic bacteria oxidize</text>
    <text x="44" y="158" fill="#2E7D32">organic matter (NH₃↓ nitrates↑)</text>
    <text x="44" y="172" fill="#2E7D32">→ tremendous drop in bacteria</text>
    <text x="44" y="186" fill="#2E7D32">(natural purification)</text>
    <text x="44" y="204" fill="#1B5E20" font-weight="bold">effect: clear + safe</text>
    <text x="44" y="222" fill="#1B5E20"></text>

    <rect x="280" y="92" width="240" height="150" rx="9" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="400" y="112" fill="#1F618D" font-weight="bold" text-anchor="middle">2 · Filtration 🕸</text>
    <text x="296" y="130" fill="#21618C">Slow sand — SCHMUTZDECKE layer</text>
    <text x="296" y="144" fill="#21618C">(jelly film = "heart" of filter) →</text>
    <text x="296" y="158" fill="#21618C">bacteria-free water · 0.1–0.4 m³/h/m²</text>
    <text x="296" y="172" fill="#21618C">Rapid sand — coagulation → mixing</text>
    <text x="296" y="186" fill="#21618C">→ flocculation → sedimentation</text>
    <text x="296" y="200" fill="#21618C">→ filtration · 99.9–99.99% removed</text>
    <text x="296" y="222" fill="#21618C"></text>

    <rect x="532" y="92" width="240" height="150" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="652" y="112" fill="#6C3483" font-weight="bold" text-anchor="middle">3 · Disinfection 🧪</text>
    <text x="548" y="130" fill="#6C3483">Chlorination — most common</text>
    <text x="548" y="144" fill="#6C3483">Ozonation · UV irradiation</text>
    <text x="548" y="158" fill="#6C3483"></text>
    <text x="548" y="176" fill="#6C3483"></text>
    <text x="548" y="216" fill="#4A148C" font-weight="bold">slow sand → biological</text>
    <text x="548" y="230" fill="#4A148C" font-weight="bold">rapid sand → mechanical</text>
  </g>

  <text x="28" y="260" font-size="13.5" font-weight="bold" fill="#558B2F">🏡 Small-scale (household) purification</text>
  <g font-size="11">
    <rect x="28" y="268" width="236" height="66" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="146" y="288" fill="#922B21" font-weight="bold" text-anchor="middle">a · Boiling ☕</text>
    <text x="44" y="306" fill="#7b241c">Rolling boil 5–10 min kills</text>
    <text x="44" y="320" fill="#7b241c">bacteria, spores, cysts &amp; ova</text>
    <text x="44" y="334" fill="#7b241c">— best home method</text>
    <rect x="276" y="268" width="236" height="66" rx="9" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="394" y="288" fill="#9C640C" font-weight="bold" text-anchor="middle">b · Chemical disinfection 🧪</text>
    <text x="292" y="306" fill="#7E5109">Bleaching powder 30 g/100 gal</text>
    <text x="292" y="320" fill="#7E5109">· alum 2–5 g/gal · iodine 2 ppm</text>
    <text x="292" y="334" fill="#7E5109">chlorine tab (0.5 g/20 L) · KMnO₄</text>
    <rect x="524" y="268" width="248" height="66" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="648" y="288" fill="#6C3483" font-weight="bold" text-anchor="middle">c · Household filters</text>
    <text x="540" y="306" fill="#6C3483">Pasteur–Chamberland ·</text>
    <text x="540" y="320" fill="#6C3483">Berkefeld · Katadyn</text>
    <text x="540" y="334" fill="#6C3483"></text>
  </g>

  <text x="28" y="352" font-size="13.5" font-weight="bold" fill="#558B2F">🧪 Chlorination — chemistry &amp; principles</text>
  <rect x="28" y="360" width="744" height="40" rx="9" fill="#FDECEC" stroke="#C0392B"/>
  <text x="46" y="378" font-size="11.5" fill="#922B21">🔴 Cl₂ + H₂O → HCl + HOCl (hypochlorous acid) · HOCl ↔ H⁺ + OCl⁻</text>
  <text x="46" y="394" font-size="11.5" fill="#922B21"><tspan font-weight="bold">Disinfection is mainly due to HOCl (hypochlorous acid)</tspan> — also kills spores &amp; some viruses in high doses</text>

  <g font-size="11">
    <rect x="28" y="408" width="240" height="90" rx="9" fill="#E8F5E9" stroke="#43A047"/>
    <text x="148" y="428" fill="#1B5E20" font-weight="bold" text-anchor="middle">4 principles</text>
    <text x="44" y="446" fill="#2E7D32">1 Water must be clear (no turbidity)</text>
    <text x="44" y="460" fill="#2E7D32">2 Estimate chlorine demand</text>
    <text x="44" y="474" fill="#2E7D32">3 Free residual Cl ≥0.5 mg/L for 1 hr</text>
    <text x="44" y="488" fill="#2E7D32">4 Dose = demand + 0.5 mg/L</text>
    <rect x="280" y="408" width="240" height="90" rx="9" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="400" y="428" fill="#1F618D" font-weight="bold" text-anchor="middle">Special methods</text>
    <text x="296" y="446" fill="#21618C">Super-chlorination → high dose +</text>
    <text x="296" y="460" fill="#21618C">dechlorination (fluctuating quality)</text>
    <text x="296" y="474" fill="#21618C">Break-point chlorination — all</text>
    <text x="296" y="488" fill="#21618C">chloramines destroyed → free residual</text>
    <rect x="532" y="408" width="240" height="90" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="652" y="428" fill="#6C3483" font-weight="bold" text-anchor="middle">Well disinfection 🕳</text>
    <text x="548" y="446" fill="#6C3483">Volume = πd²h/4 ×1000 L</text>
    <text x="548" y="460" fill="#6C3483">Chlorine demand (Horrock's)</text>
    <text x="548" y="474" fill="#6C3483">~2.5 g bleaching powder/100 L</text>
    <text x="548" y="488" fill="#6C3483">contact 1 hr · orthotolidine test</text>
  </g>

  <text x="28" y="510" width="744" text-anchor="start" font-size="11" fill="#7E5109">Functions of chlorine: kills pathogens · oxidizes Fe/Mn/H₂S · destroys taste &amp; odour · controls algae · aids coagulation</text>
  <rect x="28" y="528" width="744" height="22" rx="7" fill="#558B2F" fill-opacity="0.08"/>
  <text x="46" y="543" font-size="11.5" font-weight="bold" fill="#33691E">🎯 Large = storage + filtration + disinfection · Small = boil 5–10 min · Chlorine dose = demand + 0.5 mg/L free residual</text>
</svg>