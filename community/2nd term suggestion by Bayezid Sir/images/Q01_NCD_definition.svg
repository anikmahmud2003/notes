<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="NCD definition and cardinal characteristics">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#0E7C7B"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q1 · Non-Communicable Disease (NCD)</text>
  <text x="29" y="56" font-size="13" fill="#bde1e0">Definition 🔴 + Cardinal characteristics 📌</text>

  <rect x="28" y="88" width="744" height="104" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/>
  <text x="46" y="112" font-size="15" font-weight="bold" fill="#922B21">🔴 NCD = chronic, NON-infectious &amp; NON-transmissible diseases</text>
  <text x="46" y="134" font-size="13" fill="#5b1f18">Causative agent not clearly identified — but a SET of RISK FACTORS is associated.</text>
  <text x="46" y="154" font-size="13" fill="#5b1f18">• Long duration, generally slow progression</text>
  <text x="46" y="174" font-size="13" fill="#5b1f18">• Result of combination of genetic + physiological + environmental + behavioural factors</text>

  <text x="28" y="216" font-size="16" font-weight="bold" fill="#0E7C7B">📌 Cardinal Characteristics of Chronic Disease</text>
  <text x="28" y="233" font-size="11" fill="#7f8c8d">(Commission on Chronic Illness, USA — quoted in Park)</text>

  <g font-size="13">
    <rect x="28" y="244" width="744" height="38" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
    <text x="46" y="267" fill="#9C640C"><tspan font-weight="bold">1 Permanent</tspan> — little or no hope of complete recovery</text>

    <rect x="28" y="290" width="744" height="38" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
    <text x="46" y="313" fill="#9C640C"><tspan font-weight="bold">2 Residual disability</tspan> — left behind even after treatment</text>

    <rect x="28" y="336" width="744" height="38" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
    <text x="46" y="359" fill="#9C640C"><tspan font-weight="bold">3 Non-reversible pathology</tspan> — irreversible pathological alteration</text>

    <rect x="28" y="382" width="744" height="38" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
    <text x="46" y="405" fill="#9C640C"><tspan font-weight="bold">4 Rehabilitation</tspan> — requires special training of the patient</text>

    <rect x="28" y="428" width="744" height="38" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
    <text x="46" y="451" fill="#9C640C"><tspan font-weight="bold">5 Long-term care</tspan> — long period of supervision, observation or care</text>
  </g>

  <rect x="28" y="482" width="744" height="56" rx="10" fill="#0E7C7B" fill-opacity="0.08"/>
  <text x="46" y="505" font-size="13.5" font-weight="bold" fill="#09514F">🎯 NCD = chronic · non-infectious · non-transmissible · multifactorial · irreversible · disabling</text>
  <text x="46" y="525" font-size="12.5" fill="#0E7C7B">Characterised by: permanent + residual disability + irreversible pathology + rehabilitation + long-term care</text>
</svg>