<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Domestic accident, epidemiological triad of RTA, industrial and sports accidents, disaster classification">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#C62828"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q40 · Domestic &amp; Other Accidents · Disaster 🏠</text>
  <text x="29" y="56" font-size="13" fill="#f8c9cb">Domestic accidents · RTA triad · industrial · sports · disasters</text>

  <text x="28" y="84" font-size="14" font-weight="bold" fill="#C62828">🏠 Domestic accidents (common 10)</text>
  <g font-size="11">
    <rect x="28" y="92" width="130" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="93" y="115" fill="#922B21" text-anchor="middle">1 Bruises &amp; cuts</text>
    <rect x="166" y="92" width="130" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="231" y="115" fill="#922B21" text-anchor="middle">2 Falls 🧗</text>
    <rect x="304" y="92" width="130" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="369" y="115" fill="#922B21" text-anchor="middle">3 Burns 🔥</text>
    <rect x="442" y="92" width="130" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="507" y="115" fill="#922B21" text-anchor="middle">4 Bites &amp; stings</text>
    <rect x="580" y="92" width="192" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="676" y="115" fill="#922B21" text-anchor="middle">5 Electric shock ⚡</text>
    <rect x="28" y="138" width="192" height="38" rx="8" fill="#FDEBD0" stroke="#E67E22"/><text x="124" y="161" fill="#9C640C" text-anchor="middle">6 Poisoning ☠ (drugs, insecticide)</text>
    <rect x="228" y="138" width="160" height="38" rx="8" fill="#FDEBD0" stroke="#E67E22"/><text x="308" y="161" fill="#9C640C" text-anchor="middle">7 Suffocation</text>
    <rect x="396" y="138" width="196" height="38" rx="8" fill="#FDEBD0" stroke="#E67E22"/><text x="494" y="161" fill="#9C640C" text-anchor="middle">8 Foreign body</text>
    <rect x="600" y="138" width="172" height="38" rx="8" fill="#FDEBD0" stroke="#E67E22"/><text x="686" y="161" fill="#9C640C" text-anchor="middle">9 Drowning 🌊</text>
    <rect x="28" y="184" width="744" height="26" rx="7" fill="#FDF2E9"/>
    <text x="46" y="201" font-size="11" fill="#7E5109">Prevention: first-aid knowledge (mouth-to-mouth) · sharp tools locked · medicines out of reach · dry non-slippery bathroom · emergency numbers known</text>
  </g>

  <text x="28" y="228" font-size="14" font-weight="bold" fill="#C62828">🔺 Epidemiological triad of RTA</text>
  <g font-size="11.5">
    <rect x="28" y="236" width="356" height="20" rx="6" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="206" y="251" fill="#6C3483" text-anchor="middle" font-weight="bold">HOST : alcohol/drug · bad vision · no seat belt · stolen vehicle</text>
    <rect x="28" y="264" width="356" height="20" rx="6" fill="#FDEBD0" stroke="#E67E22"/>
    <text x="206" y="279" fill="#9C640C" text-anchor="middle" font-weight="bold">AGENT : mechanical/kinetic energy (automobile crash)</text>
    <rect x="28" y="292" width="356" height="20" rx="6" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="206" y="307" fill="#1F618D" text-anchor="middle" font-weight="bold">ENVIRONMENT : bad roads/barriers · mixed traffic · bad weather</text>
    <rect x="28" y="320" width="356" height="20" rx="6" fill="#E8F5E9" stroke="#43A047"/>
    <text x="206" y="335" fill="#1B5E20" text-anchor="middle" font-weight="bold">VECTOR : carriers of energy — the automobiles 🚗</text>
    <rect x="400" y="236" width="372" height="104" rx="10" fill="#E0E0E0"/>
  </g>
  <g font-size="11.5">
    <polygon points="400,372 568,372 604,408 400,408" fill="#C62828"/>
    <polygon points="400,306 400,372 422,340 400,306" fill="#C62828"/>
    <text x="492" y="394" fill="#7F1D1D" font-weight="bold">Crash = host receives energy</text>
    <text x="492" y="410" fill="#7F1D1D">via vehicle (vector) in a hazardous environment</text>
  </g>

  <g font-size="11">
    <rect x="28" y="360" width="356" height="74" rx="10" fill="#FDF2E9" stroke="#D68910"/>
    <text x="206" y="380" fill="#9C640C" font-weight="bold" text-anchor="middle">🏭 Industrial accidents</text>
    <text x="44" y="398" fill="#7E5109">abrasion, crush, fall, fire, electrocution, chemical burn</text>
    <text x="44" y="414" fill="#7E5109">eye/gas/radiation injuries · prevent: guards, PPE, training, pre-placement exam</text>
    <rect x="400" y="360" width="372" height="74" rx="10" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="586" y="380" fill="#6C3483" font-weight="bold" text-anchor="middle">🏟 Sports accidents</text>
    <text x="416" y="398" fill="#6C3483">limb injuries 80% · serious damage to skull, thorax,</text>
    <text x="416" y="414" fill="#6C3483">spinal cord · prevent = information + proper training</text>
  </g>

  <text x="28" y="452" font-size="14" font-weight="bold" fill="#C62828">🌪 Disaster (WHO) — definition &amp; classification</text>
  <rect x="28" y="460" width="744" height="28" rx="8" fill="#FDECEC" stroke="#C0392B"/>
  <text x="46" y="478" font-size="11.5" fill="#922B21">🔴 Any occurrence causing damage / economic disruption / loss of life / deterioration of health services — warranting extraordinary response from <tspan font-weight="bold">outside</tspan> the area</text>
  <g font-size="11">
    <rect x="28" y="496" width="360" height="50" rx="9" fill="#FDEBD0" stroke="#E67E22"/>
    <text x="208" y="514" fill="#9C640C" font-weight="bold" text-anchor="middle">A · Natural 🌋</text>
    <text x="44" y="532" fill="#7E5109">cyclone · flood · earthquake · drought · epidemic · fire</text>
    <rect x="412" y="496" width="360" height="50" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="592" y="514" fill="#6C3483" font-weight="bold" text-anchor="middle">B · Man-made 🧨</text>
    <text x="428" y="532" fill="#6C3483">nuclear/chemical leak · war · riot · famine · terror · crash</text>
  </g>
</svg>