<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Five occupational health hazards and offensive trades">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#37474F"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q44 · Occupational Health Hazards ⚠️</text>
  <text x="29" y="56" font-size="13" fill="#cfd8dc">5 types of hazards · agent→disease · offensive trades</text>

  <text x="28" y="84" font-size="14" font-weight="bold" fill="#37474F">⚠️ Five types of occupational hazards</text>
  <g font-size="10.5">
    <rect x="28" y="92" width="240" height="196" rx="10" fill="#FDECEC" stroke="#C0392B"/>
    <text x="148" y="112" fill="#922B21" font-weight="bold" text-anchor="middle">1 · Physical 🌡</text>
    <text x="44" y="130" fill="#7b241c">Heat → hyperpyrexia, heat stroke,</text>
    <text x="44" y="144" fill="#7b241c">cramps, burns, prickly heat</text>
    <text x="44" y="160" fill="#7b241c">Cold → trench foot, frostbite</text>
    <text x="44" y="176" fill="#7b241c">Light → occupational cataract</text>
    <text x="44" y="192" fill="#7b241c">Pressure → caisson disease</text>
    <text x="44" y="208" fill="#7b241c">Noise → occupational deafness</text>
    <text x="44" y="224" fill="#7b241c">Radiation → cancer, leukaemia,</text>
    <text x="44" y="238" fill="#7b241c">aplastic anaemia</text>
    <text x="44" y="256" fill="#7b241c">Mechanical → injuries · Electricity</text>
    <text x="44" y="272" fill="#7b241c">→ burns</text>
    <text x="44" y="286" fill="#7b241c"></text>

    <rect x="280" y="92" width="240" height="196" rx="10" fill="#FDEBD0" stroke="#E67E22"/>
    <text x="400" y="112" fill="#9C640C" font-weight="bold" text-anchor="middle">2 · Chemical 🧪</text>
    <text x="296" y="130" fill="#7E5109">Local: dermatitis, eczema, ulcers,</text>
    <text x="296" y="144" fill="#7E5109">cancer (acids, alkalies, pesticides)</text>
    <text x="296" y="160" fill="#7E5109" font-weight="bold">Solvents: benzene, CS₂, C₆H₆</text>
    <text x="296" y="176" fill="#7E5109">Inhalation gases: CO·CO₂·HCN·NH₃</text>
    <text x="296" y="192" fill="#7E5109">→ gas poisoning</text>
    <text x="296" y="208" fill="#7E5109">Metals: lead, mercury, cadmium,</text>
    <text x="296" y="224" fill="#7E5109">manganese, chromium, arsenic</text>
    <text x="296" y="240" fill="#7E5109">Dusts → pneumoconiosis</text>
    <text x="296" y="256" fill="#7E5109">(coal·silica·iron·cotton·hay)</text>
    <text x="296" y="272" fill="#7E5109">Ingestion: mercury, lead, arsenic</text>
    <text x="296" y="286" fill="#7E5109"></text>

    <rect x="532" y="92" width="240" height="96" rx="10" fill="#E0F2F1" stroke="#00897B"/>
    <text x="652" y="112" fill="#004D40" font-weight="bold" text-anchor="middle">3 · Biological 🦠</text>
    <text x="548" y="130" fill="#00695C">Brucellosis · leptospirosis · anthrax</text>
    <text x="548" y="144" fill="#00695C">actinomycosis · hydatidosis ·</text>
    <text x="548" y="158" fill="#00695C">psittacosis · tetanus · encephalitis</text>
    <text x="548" y="172" fill="#00695C">fungal infections</text>
    <text x="548" y="186" fill="#00695C">(from animals, hides, wool)</text>
  </g>

  <g font-size="10.5">
    <rect x="532" y="196" width="240" height="52" rx="10" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="652" y="216" fill="#6C3483" font-weight="bold" text-anchor="middle">4 · Mechanical ⚙️</text>
    <text x="548" y="234" fill="#6C3483">center round machinery</text>
    <text x="548" y="248" fill="#6C3483">protruding &amp; moving parts</text>
  </g>

  <g font-size="10.5">
    <rect x="532" y="252" width="240" height="36" rx="8" fill="#B3E5FC"/>
    <text x="652" y="274" fill="#01579B" font-weight="bold" text-anchor="middle">Occupational cancer</text>
  </g>
  <g font-size="10">
    <rect x="28" y="300" width="240" height="78" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="148" y="320" fill="#6C3483" font-weight="bold" text-anchor="middle">5 · Psychosocial 🧠</text>
    <text x="44" y="338" fill="#6C3483">Behavioural: hostility, anxiety,</text>
    <text x="44" y="352" fill="#6C3483">depression, alcoholism, drug abuse,</text>
    <text x="44" y="366" fill="#6C3483">sickness absenteeism</text>
    <text x="44" y="380" fill="#6C3483">Psychosomatic: peptic ulcer,</text>
    <text x="44" y="394" fill="#6C3483">hypertension, heart disease, fatigue</text>
    <rect x="280" y="300" width="240" height="78" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="400" y="320" fill="#922B21" font-weight="bold" text-anchor="middle">🎗 Occupational cancer</text>
    <text x="296" y="338" fill="#7b241c">Skin: coal tar</text>
    <text x="296" y="352" fill="#7b241c">Lung: asbestos, nickel, uranium</text>
    <text x="296" y="366" fill="#7b241c">Bladder: beta-naphthylamine</text>
    <text x="296" y="380" fill="#7b241c">Leukaemia: benzene, X-ray</text>
    <text x="296" y="394" fill="#7b241c"></text>
  </g>

  <text x="28" y="392" font-size="13.5" font-weight="bold" fill="#37474F">🏭 Offensive trades</text>
  <g font-size="11">
    <rect x="28" y="400" width="744" height="26" rx="8" fill="#ECEFF1" stroke="#546E7A"/>
    <text x="46" y="418" font-size="11.5" fill="#263238">🔴 Any trade that may impair health of a person or is a source of nuisance from public health point of view</text>
    <rect x="28" y="434" width="230" height="56" rx="8" fill="#FDEBD0" stroke="#E67E22"/><text x="143" y="453" fill="#9C640C" font-weight="bold" text-anchor="middle">Tannery · leather 🌐</text><text x="143" y="469" fill="#7E5109" text-anchor="middle">slaughtering · keeping</text><text x="143" y="483" fill="#7E5109" text-anchor="middle">animals &amp; trading</text>
    <rect x="270" y="434" width="230" height="56" rx="8" fill="#FDEBD0" stroke="#E67E22"/><text x="385" y="453" fill="#9C640C" font-weight="bold" text-anchor="middle">Fat/bone boiling 🔥</text><text x="385" y="469" fill="#7E5109" text-anchor="middle">grease · fertilizer</text><text x="385" y="483" fill="#7E5109" text-anchor="middle">factories · gut scrapping</text>
    <rect x="512" y="434" width="260" height="56" rx="8" fill="#FDEBD0" stroke="#E67E22"/><text x="642" y="453" fill="#9C640C" font-weight="bold" text-anchor="middle">Dusty mills &amp; factories</text><text x="642" y="469" fill="#7E5109" text-anchor="middle">jute · rice · flour · cotton · sugar</text><text x="642" y="483" fill="#7E5109" text-anchor="middle">cement · fertilizer · tobacco</text>
    <rect x="28" y="498" width="744" height="22" rx="7" fill="#E0F2F1"/>
    <text x="46" y="513" font-size="10.5" fill="#004D40">Prevention: away from houses · masks/gloves/aprons · ventilation · PPE · pre-employment exam · periodic check-up · legislation</text>
  </g>

  <rect x="28" y="528" width="744" height="22" rx="8" fill="#37474F" fill-opacity="0.08"/>
  <text x="46" y="543" font-size="11.5" font-weight="bold" fill="#1A2428">🎯 5 hazards = physical + chemical + biological + mechanical + psychosocial · Offensive trade = impairs health / is a nuisance (tannery, slaughter, bone boiling, dusty mills)</text>
</svg>