<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Ventilation definition, purpose, standards, classification and effects of ill ventilation">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#558B2F"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q53 · Ventilation 🪟</text>
  <text x="29" y="56" font-size="13" fill="#e8efd8">Definition · purpose · standards · natural vs mechanical · ill effects</text>

  <rect x="28" y="82" width="744" height="40" rx="10" fill="#F1F8E9" stroke="#558B2F" stroke-width="2"/>
  <text x="46" y="100" font-size="12" fill="#33691E" font-weight="bold">🔴 Ventilation = science of maintaining atmospheric conditions comfortable &amp; healthful to the human body</text>
  <text x="46" y="117" font-size="11" fill="#33691E">Modern: replace vitiated air with fresh outdoor air + control temp · humidity · purity</text>

  <text x="28" y="140" font-size="13.5" font-weight="bold" fill="#558B2F">🎯 Purpose (4)</text>
  <g font-size="11">
    <rect x="28" y="148" width="180" height="44" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="118" y="166" fill="#1B5E20" font-weight="bold" text-anchor="middle">1 Replace vitiated air</text><text x="118" y="183" fill="#2E7D32" text-anchor="middle"></text>
    <rect x="216" y="148" width="180" height="44" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="306" y="166" fill="#1B5E20" font-weight="bold" text-anchor="middle">2 Supply O₂ &amp; fresh air</text><text x="306" y="183" fill="#2E7D32" text-anchor="middle"></text>
    <rect x="404" y="148" width="180" height="44" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="494" y="166" fill="#1B5E20" font-weight="bold" text-anchor="middle">3 Control temp &amp; humidity</text><text x="494" y="183" fill="#2E7D32" text-anchor="middle">thermal environment</text>
    <rect x="592" y="148" width="180" height="44" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="682" y="166" fill="#1B5E20" font-weight="bold" text-anchor="middle">4 Dilute contamination</text><text x="682" y="183" fill="#2E7D32" text-anchor="middle">to acceptable level</text>
  </g>

  <text x="28" y="212" font-size="13.5" font-weight="bold" fill="#558B2F">📐 Standards (viva)</text>
  <g font-size="11">
    <rect x="28" y="220" width="240" height="48" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="148" y="238" fill="#9C640C" font-weight="bold" text-anchor="middle">Cubic space</text><text x="148" y="255" fill="#7E5109" text-anchor="middle">1000–1200 cft/person</text>
    <rect x="280" y="220" width="240" height="48" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="400" y="238" fill="#9C640C" font-weight="bold" text-anchor="middle">Air change / hr</text><text x="400" y="255" fill="#7E5109" text-anchor="middle">2–3 home · 4–6 assemblies</text>
    <rect x="532" y="220" width="240" height="48" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="652" y="238" fill="#9C640C" font-weight="bold" text-anchor="middle">Floor space</text><text x="652" y="255" fill="#7E5109" text-anchor="middle">50–100 sq ft/person</text>
  </g>

  <text x="28" y="286" font-size="13.5" font-weight="bold" fill="#558B2F">🗂 Classification of ventilation</text>
  <g font-size="11">
    <rect x="28" y="294" width="372" height="130" rx="10" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="214" y="314" fill="#1F618D" font-weight="bold" text-anchor="middle">1 · Natural 🌬</text>
    <text x="44" y="332" fill="#21618C"><tspan font-weight="bold">The wind:</tspan> perflation · aspiration</text>
    <text x="44" y="346" fill="#21618C">· cross-ventilation (doors &amp; windows</text>
    <text x="44" y="360" fill="#21618C">facing each other)</text>
    <text x="44" y="376" fill="#21618C"><tspan font-weight="bold">Diffusion</tspan> — air through smallest</text>
    <text x="44" y="390" fill="#21618C">openings (slow)</text>
    <text x="44" y="406" fill="#21618C"><tspan font-weight="bold">Temperature difference</tspan> — warm</text>
    <text x="44" y="420" fill="#21618C">air exits high near roof</text>

    <rect x="412" y="294" width="360" height="130" rx="10" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="592" y="314" fill="#6C3483" font-weight="bold" text-anchor="middle">2 · Mechanical / artificial 🔌</text>
    <text x="428" y="332" fill="#6C3483"><tspan font-weight="bold">Exhaust</tspan> — fans extract → vacuum →</text>
    <text x="428" y="346" fill="#6C3483">fresh air enters (removes hot upper layer)</text>
    <text x="428" y="362" fill="#6C3483"><tspan font-weight="bold">Plenum</tspan> — fans blow fresh air in →</text>
    <text x="428" y="376" fill="#6C3483">positive pressure displaces vitiated air</text>
    <text x="428" y="392" fill="#6C3483"><tspan font-weight="bold">Balanced</tspan> — exhaust + plenum</text>
    <text x="428" y="408" fill="#6C3483"><tspan font-weight="bold">Air conditioning</tspan> — controls temp,</text>
    <text x="428" y="422" fill="#6C3483">humidity, air movement, dust, bacteria</text>
  </g>

  <text x="28" y="444" font-size="13.5" font-weight="bold" fill="#558B2F">😩 Effects of ill ventilation</text>
  <g font-size="11">
    <rect x="28" y="452" width="360" height="66" rx="9" fill="#FDEBD0" stroke="#E67E22"/>
    <text x="208" y="470" fill="#9C640C" font-weight="bold" text-anchor="middle">Room changes</text>
    <text x="44" y="488" fill="#7E5109">↑ temp · ↑ humidity · ↓ air movement</text>
    <text x="44" y="502" fill="#7E5109">unpleasant odours · ↑ bacteria · CO₂↑ O₂↓</text>
    <text x="44" y="514" fill="#7E5109"></text>
    <rect x="412" y="452" width="360" height="66" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="592" y="470" fill="#922B21" font-weight="bold" text-anchor="middle">Discomfort (clinical)</text>
    <text x="428" y="488" fill="#7b241c">headache · drowsiness · lassitude</text>
    <text x="428" y="502" fill="#7b241c">poor concentration · depression · fatigue</text>
    <text x="428" y="514" fill="#7b241c">↑ risk of communicable disease</text>
  </g>

  <rect x="28" y="530" width="744" height="24" rx="7" fill="#558B2F" fill-opacity="0.10"/>
  <text x="46" y="545" font-size="11.5" font-weight="bold" fill="#33691E">🎯 Natural = wind+diffusion+temp · Mechanical = exhaust+plenum+balanced+AC · Standards: 1000–1200 cft + 2–3 air changes/hr</text>
</svg>