<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Obesity definition, risk factors, complications and prevention">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#7D6608"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q20 · Obesity ⚖️</text>
  <text x="29" y="56" font-size="13" fill="#f2e8c6">Definition · types · risk factors · health risks · prevention</text>

  <rect x="28" y="86" width="744" height="70" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/>
  <text x="46" y="108" font-size="13.5" font-weight="bold" fill="#922B21">🔴 Obesity = abnormal growth of adipose tissue</text>
  <text x="46" y="128" font-size="12.5" fill="#7b241c">• Hypertrophic (↑ fat-cell size) · Hyperplastic (↑ fat-cell number) · or both</text>
  <text x="46" y="146" font-size="12.5" fill="#7b241c">• Simple: BMI &gt; 30 (30–39.9) · Types: generalized vs abdominal/central (higher metabolic risk)</text>

  <text x="28" y="176" font-size="14" font-weight="bold" fill="#7D6608">⚠️ Risk factors</text>
  <g font-size="12">
    <rect x="28" y="184" width="364" height="86" rx="10" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="44" y="206" font-weight="bold" fill="#9C640C">Behavioural</text>
    <text x="44" y="226" fill="#7E5109">Sedentary worker · energy-dense</text>
    <text x="44" y="244" fill="#7E5109">high-CHO/fat diet · alcohol · smoking</text>
    <text x="44" y="262" fill="#7E5109">high blood pressure</text>

    <rect x="408" y="184" width="364" height="86" rx="10" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="424" y="206" font-weight="bold" fill="#6C3483">Genetic 🧬</text>
    <text x="424" y="226" fill="#6C3483">Melanin-4-receptor (melanocortin</text>
    <text x="424" y="244" fill="#6C3483">receptor) mutations</text>
    <text x="424" y="262" fill="#6C3483">Positive family history</text>
  </g>

  <text x="28" y="292" font-size="14" font-weight="bold" fill="#7D6608">🚨 Complications / health risks</text>
  <g font-size="12">
    <rect x="28" y="300" width="180" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="118" y="328" fill="#922B21" text-anchor="middle">2️⃣ Type-2 DM 🍬</text>
    <rect x="216" y="300" width="180" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="306" y="328" fill="#922B21" text-anchor="middle">🪨 Gall stones</text>
    <rect x="404" y="300" width="180" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="494" y="328" fill="#922B21" text-anchor="middle">🦴 Osteoarthritis</text>
    <rect x="592" y="300" width="180" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="682" y="328" fill="#922B21" text-anchor="middle">😴 Sleep apnoea</text>
    <rect x="28" y="354" width="240" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="148" y="382" fill="#922B21" text-anchor="middle">🧬 Cancer (breast, colon)</text>
    <rect x="276" y="354" width="240" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="396" y="382" fill="#922B21" text-anchor="middle">🫀 HTN / cardiovascular disease</text>
    <rect x="524" y="354" width="248" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="648" y="382" fill="#922B21" text-anchor="middle">🌙 Menstrual irregularity · stress</text>
    <text x="28" y="418" font-size="11.5" fill="#7b241c">+ psychosocial problems · incontinence</text>
  </g>

  <text x="28" y="440" font-size="14" font-weight="bold" fill="#7D6608">🛡 Prevention</text>
  <g font-size="12">
    <rect x="28" y="448" width="364" height="62" rx="10" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="44" y="470" font-weight="bold" fill="#1E8449">🟢 Primary</text>
    <text x="44" y="490" fill="#145A32">Health education · manage risk factors ·</text>
    <text x="44" y="504" fill="#145A32">weight management (diet + exercise) · family support</text>

    <rect x="408" y="448" width="364" height="62" rx="10" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="424" y="470" font-weight="bold" fill="#1F618D">🔵 Secondary</text>
    <text x="424" y="490" fill="#21618C">Appetite-depressing drugs (e.g. sibutramine)</text>
    <text x="424" y="504" fill="#21618C">Surgery — gastric banding, partial gastrectomy</text>
  </g>

  <rect x="28" y="526" width="744" height="22" rx="6" fill="#FDECEC"/>
  <text x="46" y="541" font-size="11.5" font-weight="bold" fill="#922B21">🎯 BMI&gt;30 = obese · risks: DM, gallstones, OA, apnoea, cancer, HTN · Prevent: education + diet + exercise (+ drugs/surgery)</text>
</svg>