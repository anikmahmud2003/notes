<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Rheumatic fever epidemiology, consequences and prevention">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#6C3483"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q11 · Rheumatic Fever / RHD 💜</text>
  <text x="29" y="56" font-size="13" fill="#e3c9f5">Streptococcal throat → autoimmune damage of heart &amp; joints</text>

  <rect x="28" y="82" width="744" height="56" rx="10" fill="#F4ECF7" stroke="#8E44AD" stroke-width="2"/>
  <text x="46" y="104" font-size="13.5" font-weight="bold" fill="#6C3483">🔴 RF = febrile disease of connective tissues (especially heart &amp; joints)</text>
  <text x="46" y="124" font-size="12.5" fill="#6C3483">Initiated by throat infection with Group-A β-haemolytic streptococci (GABHS)</text>

  <g font-size="12.5">
    <rect x="28" y="152" width="170" height="58" rx="10" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="113" y="176" fill="#1F618D" text-anchor="middle" font-weight="bold">GABHS throat</text>
    <text x="113" y="194" fill="#21618C" text-anchor="middle">infection</text>
    <line x1="198" y1="181" x2="236" y2="181" stroke="#95A5A6" stroke-width="3" marker-end="url(#arr)"/>

    <rect x="240" y="152" width="170" height="58" rx="10" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="325" y="176" fill="#9C640C" text-anchor="middle" font-weight="bold">Cross-reactivity</text>
    <text x="325" y="194" fill="#7E5109" text-anchor="middle">immunological damage</text>
    <line x1="410" y1="181" x2="448" y2="181" stroke="#95A5A6" stroke-width="3" marker-end="url(#arr)"/>

    <rect x="452" y="152" width="170" height="58" rx="10" fill="#FDECEC" stroke="#C0392B"/>
    <text x="537" y="176" fill="#922B21" text-anchor="middle" font-weight="bold">RHEUMATIC FEVER</text>
    <text x="537" y="194" fill="#7b241c" text-anchor="middle">heart ❤️ + joints 🦵</text>
    <line x1="622" y1="181" x2="658" y2="181" stroke="#95A5A6" stroke-width="3" marker-end="url(#arr)"/>

    <rect x="662" y="152" width="110" height="58" rx="10" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="717" y="176" fill="#6C3483" text-anchor="middle" font-weight="bold">RHD</text>
    <text x="717" y="194" fill="#6C3483" text-anchor="middle">carditis</text>
  </g>

  <rect x="28" y="228" width="744" height="46" rx="10" fill="#F4F6F7" stroke="#95A5A6"/>
  <text x="46" y="249" font-size="12.5" fill="#5D6D7E">🌍 <tspan font-weight="bold">Epidemiology:</tspan> children &amp; adolescents 5–15 yr · both sexes equally · a "social disease" of poverty, overcrowding, poor housing</text>
  <text x="46" y="267" font-size="12" fill="#5D6D7E">high-risk groups: school children, slum dwellers, closed communities (barracks)</text>

  <text x="28" y="294" font-size="14" font-weight="bold" fill="#6C3483">❤️ Consequences of RHD</text>
  <g font-size="12.5">
    <rect x="28" y="302" width="178" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="117" y="330" fill="#922B21" text-anchor="middle">Continuing heart damage</text>
    <rect x="216" y="302" width="178" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="305" y="330" fill="#922B21" text-anchor="middle">Increasing disability</text>
    <rect x="404" y="302" width="178" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="493" y="330" fill="#922B21" text-anchor="middle">Repeated hospitalization</text>
    <rect x="592" y="302" width="180" height="46" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="682" y="330" fill="#922B21" text-anchor="middle">Premature death by 35 yrs</text>
  </g>

  <text x="28" y="372" font-size="14" font-weight="bold" fill="#6C3483">🛡 Prevention of RF / RHD</text>
  <g font-size="12">
    <rect x="28" y="380" width="240" height="92" rx="10" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="44" y="400" font-size="12.5" font-weight="bold" fill="#1E8449">🟢 Primary</text>
    <text x="44" y="420" fill="#145A32">Treat every sore throat:</text>
    <text x="44" y="438" fill="#145A32">Phenoxymethyl penicillin</text>
    <text x="44" y="456" fill="#145A32">250 mg 6-hourly × 10 days</text>

    <rect x="280" y="380" width="248" height="92" rx="10" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="296" y="400" font-size="12.5" font-weight="bold" fill="#1F618D">🔵 Secondary (recurrence)</text>
    <text x="296" y="420" fill="#21618C">Benzathine penicillin 1.2 MU IM</text>
    <text x="296" y="438" fill="#21618C">monthly (6 lakh units if &lt;30 kg)</text>
    <text x="296" y="456" fill="#21618C">or oral penicillin 250 mg 12-hrly</text>

    <rect x="540" y="380" width="232" height="92" rx="10" fill="#F4F6F7" stroke="#95A5A6"/>
    <text x="556" y="400" font-size="12.5" font-weight="bold" fill="#5D6D7E">⚪ Non-medical</text>
    <text x="556" y="420" fill="#5D6D7E">Improve housing, nutrition,</text>
    <text x="556" y="438" fill="#5D6D7E">socio-economic conditions</text>
    <text x="556" y="456" fill="#5D6D7E">break poverty–disease cycle</text>
  </g>

  <rect x="28" y="488" width="744" height="56" rx="10" fill="#F4ECF7" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="46" y="510" font-size="12.5" fill="#6C3483">⏱ <tspan font-weight="bold">Secondary prophylaxis duration:</tspan> ≥5 yr after last attack or till 18 yr</text>
  <text x="46" y="528" font-size="12" fill="#6C3483">with carditis → ≥10 yr or till 25 yr · severe valvular disease / post-surgery → lifelong</text>

  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#95A5A6"/></marker></defs>
</svg>