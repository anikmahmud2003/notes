<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="NCD versus communicable disease comparison">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#0E7C7B"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q2 · NCD vs Communicable Disease (CD)</text>
  <text x="29" y="56" font-size="13" fill="#bde1e0">Side-by-side comparison table ⚖️</text>

  <g font-size="12.5">
    <rect x="28" y="86" width="372" height="34" rx="8" fill="#0E7C7B"/>
    <text x="214" y="108" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🚫 NCD</text>
    <rect x="400" y="86" width="372" height="34" rx="8" fill="#C0392B"/>
    <text x="586" y="108" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🦠 CD</text>
  </g>

  <g font-size="12.5">
    <rect x="28" y="128" width="110" height="376" rx="8" fill="#F4F6F7" stroke="#95A5A6"/>
    <text x="83" y="150" font-size="13" font-weight="bold" fill="#5D6D7E" text-anchor="middle">Feature</text>

    <text x="46" y="186" fill="#5D6D7E">Cause</text>
    <text x="46" y="232" fill="#5D6D7E">Transmission</text>
    <text x="46" y="278" fill="#5D6D7E">Onset</text>
    <text x="46" y="324" fill="#5D6D7E">Duration</text>
    <text x="46" y="370" fill="#5D6D7E">Latent period</text>
    <text x="46" y="416" fill="#5D6D7E">Prevention</text>
    <text x="46" y="462" fill="#5D6D7E">Treatment</text>

    <rect x="146" y="162" width="226" height="52" rx="8" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="160" y="184" fill="#1F618D">Multifactorial; no single agent;</text>
    <text x="160" y="200" fill="#1F618D">risk factors identified</text>

    <rect x="400" y="162" width="372" height="52" rx="8" fill="#FDECEC" stroke="#C0392B"/>
    <text x="414" y="184" fill="#922B21">Specific infectious agent</text>
    <text x="414" y="200" fill="#922B21">(bacteria, virus, parasite…)</text>

    <rect x="146" y="208" width="226" height="52" rx="8" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="160" y="230" fill="#1F618D">NOT transmitted from</text>
    <text x="160" y="246" fill="#1F618D">person to person</text>

    <rect x="400" y="208" width="372" height="52" rx="8" fill="#FDECEC" stroke="#C0392B"/>
    <text x="414" y="230" fill="#922B21">Transmitted — air, water, food,</text>
    <text x="414" y="246" fill="#922B21">vector, contact</text>

    <rect x="146" y="254" width="226" height="52" rx="8" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="160" y="276" fill="#1F618D">Slow, insidious</text>

    <rect x="400" y="254" width="372" height="52" rx="8" fill="#FDECEC" stroke="#C0392B"/>
    <text x="414" y="276" fill="#922B21">Usually acute</text>

    <rect x="146" y="300" width="226" height="52" rx="8" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="160" y="322" fill="#1F618D">Chronic, irreversible;</text>
    <text x="160" y="338" fill="#1F618D">residual disability common</text>

    <rect x="400" y="300" width="372" height="52" rx="8" fill="#FDECEC" stroke="#C0392B"/>
    <text x="414" y="322" fill="#922B21">Short, self-limiting;</text>
    <text x="414" y="338" fill="#922B21">often fully recoverable</text>

    <rect x="146" y="346" width="226" height="52" rx="8" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="160" y="368" fill="#1F618D">Long (years)</text>

    <rect x="400" y="346" width="372" height="52" rx="8" fill="#FDECEC" stroke="#C0392B"/>
    <text x="414" y="368" fill="#922B21">Short (incubation period)</text>

    <rect x="146" y="392" width="226" height="52" rx="8" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="160" y="414" fill="#1E8449">Lifestyle change · screening</text>
    <text x="160" y="430" fill="#1E8449">risk-factor control</text>

    <rect x="400" y="392" width="372" height="52" rx="8" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="414" y="414" fill="#1E8449">Vaccination · sanitation</text>
    <text x="414" y="430" fill="#1E8449">vector control · isolation</text>

    <rect x="146" y="438" width="226" height="52" rx="8" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="160" y="460" fill="#6C3483">Long-term management &amp;</text>
    <text x="160" y="476" fill="#6C3483">rehabilitation</text>

    <rect x="400" y="438" width="372" height="52" rx="8" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="414" y="460" fill="#6C3483">Curative — antibiotics, antivirals,</text>
    <text x="414" y="476" fill="#6C3483">antiparasitics</text>
  </g>

  <text x="28" y="526" font-size="12.5" font-weight="bold" fill="#09514F">🎯 NCD = no clear agent + not transmissible + chronic + irreversible · CD = specific agent + transmissible + often acute + curable</text>
</svg>