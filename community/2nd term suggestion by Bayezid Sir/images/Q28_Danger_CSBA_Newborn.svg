<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Danger signs of pregnancy, CSBA and newborn care with APGAR score">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#D81B60"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q28 · Danger Signs · CSBA · Newborn Care 👶</text>
  <text x="29" y="56" font-size="13" fill="#f8cddd">Warning signs of pregnancy · 6 cleans · immediate &amp; late care · APGAR</text>

  <text x="28" y="86" font-size="14" font-weight="bold" fill="#D81B60">⚠️ Danger signs of pregnancy (report immediately!)</text>
  <g font-size="12">
    <rect x="28" y="94" width="144" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="100" y="117" fill="#922B21" text-anchor="middle">🦶 Swelling of feet</text>
    <rect x="180" y="94" width="144" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="252" y="117" fill="#922B21" text-anchor="middle">😵 Fits (convulsions)</text>
    <rect x="332" y="94" width="144" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="404" y="117" fill="#922B21" text-anchor="middle">🤕 Persistent headache</text>
    <rect x="484" y="94" width="140" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="554" y="117" fill="#922B21" text-anchor="middle">👁 Blurring of vision</text>
    <rect x="632" y="94" width="140" height="38" rx="8" fill="#FDECEC" stroke="#C0392B"/><text x="702" y="117" fill="#922B21" text-anchor="middle">🩸 PV bleeding/discharge</text>
  </g>

  <text x="28" y="152" font-size="14" font-weight="bold" fill="#D81B60">🧼 CSBA — Clean, Safe Birth Attendant (the "6 cleans")</text>
  <g font-size="11.5">
    <rect x="28" y="160" width="118" height="48" rx="8" fill="#EBF5FB" stroke="#2980B9"/><text x="87" y="181" fill="#1F618D" font-weight="bold" text-anchor="middle">1 · Clean hands</text><text x="87" y="198" fill="#21618C" text-anchor="middle">🧽</text>
    <rect x="154" y="160" width="118" height="48" rx="8" fill="#EBF5FB" stroke="#2980B9"/><text x="213" y="181" fill="#1F618D" font-weight="bold" text-anchor="middle">2 · Clean surface</text><text x="213" y="198" fill="#21618C" text-anchor="middle">🛏</text>
    <rect x="280" y="160" width="118" height="48" rx="8" fill="#EBF5FB" stroke="#2980B9"/><text x="339" y="181" fill="#1F618D" font-weight="bold" text-anchor="middle">3 · Clean equip.</text><text x="339" y="198" fill="#21618C" text-anchor="middle">🧪 sterilised</text>
    <rect x="406" y="160" width="118" height="48" rx="8" fill="#EBF5FB" stroke="#2980B9"/><text x="465" y="181" fill="#1F618D" font-weight="bold" text-anchor="middle">4 · Skilled person</text><text x="465" y="198" fill="#21618C" text-anchor="middle">👩‍⚕️</text>
    <rect x="532" y="160" width="118" height="48" rx="8" fill="#EBF5FB" stroke="#2980B9"/><text x="591" y="181" fill="#1F618D" font-weight="bold" text-anchor="middle">5 · Readiness</text><text x="591" y="198" fill="#21618C" text-anchor="middle">for complications</text>
    <rect x="658" y="160" width="114" height="48" rx="8" fill="#EBF5FB" stroke="#2980B9"/><text x="715" y="181" fill="#1F618D" font-weight="bold" text-anchor="middle">6 · Newborn care</text><text x="715" y="198" fill="#21618C" text-anchor="middle">👶</text>
  </g>

  <text x="28" y="228" font-size="14" font-weight="bold" fill="#D81B60">👶 Immediate care of the newborn (10 steps)</text>
  <rect x="28" y="236" width="744" height="56" rx="10" fill="#F4ECF7" stroke="#8E44AD"/>
  <text x="46" y="258" font-size="11.5" fill="#6C3483">1 Airway/resuscitation · 2 APGAR (1 &amp; 5 min) · 3 Cord cut aseptically · 4 Eyes — 1% AgNO₃ (Crede) · 5 Skin bath later</text>
  <text x="46" y="276" font-size="11.5" fill="#6C3483">6 Maintain temperature · 7 Breast feeding ASAP · 8 Examine for congenital anomalies · 9 Identification · 10 Rooming-in</text>

  <text x="28" y="310" font-size="14" font-weight="bold" fill="#D81B60">🩺 APGAR score</text>
  <text x="28" y="324" font-size="11" fill="#7f8c8d">at 1 &amp; 5 minutes · total 10 · perfect 9–10 · severe depression 0–3 · moderate 4–6 · minimal 7–10 · &lt;5 = act!</text>
  <g font-size="11">
    <rect x="28" y="332" width="210" height="26" fill="#34495E"/><text x="133" y="349" fill="#ffffff" font-weight="bold" text-anchor="middle">Parameter</text>
    <rect x="238" y="332" width="170" height="26" fill="#34495E"/><text x="323" y="349" fill="#ffffff" font-weight="bold" text-anchor="middle">0</text>
    <rect x="408" y="332" width="180" height="26" fill="#34495E"/><text x="498" y="349" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
    <rect x="588" y="332" width="184" height="26" fill="#34495E"/><text x="680" y="349" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>

    <rect x="28" y="358" width="210" height="34" fill="#F4ECF7"/><text x="46" y="380" fill="#6C3483"><tspan font-weight="bold">A</tspan>ppearance (colour)</text>
    <rect x="238" y="358" width="170" height="34" fill="#F4F6F7"/><text x="323" y="380" fill="#5D6D7E" text-anchor="middle">Blue / pale</text>
    <rect x="408" y="358" width="180" height="34" fill="#F4F6F7"/><text x="498" y="380" fill="#5D6D7E" text-anchor="middle">Body pink, limbs blue</text>
    <rect x="588" y="358" width="184" height="34" fill="#EAFAF1"/><text x="680" y="380" fill="#1E8449" text-anchor="middle">Completely pink</text>

    <rect x="28" y="392" width="210" height="34" fill="#F4ECF7"/><text x="46" y="414" fill="#6C3483"><tspan font-weight="bold">P</tspan>ulse (heart rate)</text>
    <rect x="238" y="392" width="170" height="34" fill="#F4F6F7"/><text x="323" y="414" fill="#5D6D7E" text-anchor="middle">Absent</text>
    <rect x="408" y="392" width="180" height="34" fill="#F4F6F7"/><text x="498" y="414" fill="#5D6D7E" text-anchor="middle">&lt;100/min</text>
    <rect x="588" y="392" width="184" height="34" fill="#EAFAF1"/><text x="680" y="414" fill="#1E8449" text-anchor="middle">&gt;100/min</text>

    <rect x="28" y="426" width="210" height="34" fill="#F4ECF7"/><text x="46" y="448" fill="#6C3483"><tspan font-weight="bold">G</tspan>rimace (response)</text>
    <rect x="238" y="426" width="170" height="34" fill="#F4F6F7"/><text x="323" y="448" fill="#5D6D7E" text-anchor="middle">No response</text>
    <rect x="408" y="426" width="180" height="34" fill="#F4F6F7"/><text x="498" y="448" fill="#5D6D7E" text-anchor="middle">Grimace</text>
    <rect x="588" y="426" width="184" height="34" fill="#EAFAF1"/><text x="680" y="448" fill="#1E8449" text-anchor="middle">Cry</text>

    <rect x="28" y="460" width="210" height="34" fill="#F4ECF7"/><text x="46" y="482" fill="#6C3483"><tspan font-weight="bold">A</tspan>ctivity (muscle tone)</text>
    <rect x="238" y="460" width="170" height="34" fill="#F4F6F7"/><text x="323" y="482" fill="#5D6D7E" text-anchor="middle">Flaccid</text>
    <rect x="408" y="460" width="180" height="34" fill="#F4F6F7"/><text x="498" y="482" fill="#5D6D7E" text-anchor="middle">Some flexion</text>
    <rect x="588" y="460" width="184" height="34" fill="#EAFAF1"/><text x="680" y="482" fill="#1E8449" text-anchor="middle">Active movement</text>

    <rect x="28" y="494" width="210" height="34" fill="#F4ECF7"/><text x="46" y="516" fill="#6C3483"><tspan font-weight="bold">R</tspan>espiration</text>
    <rect x="238" y="494" width="170" height="34" fill="#F4F6F7"/><text x="323" y="516" fill="#5D6D7E" text-anchor="middle">Absent</text>
    <rect x="408" y="494" width="180" height="34" fill="#F4F6F7"/><text x="498" y="516" fill="#5D6D7E" text-anchor="middle">Slow, irregular</text>
    <rect x="588" y="494" width="184" height="34" fill="#EAFAF1"/><text x="680" y="516" fill="#1E8449" text-anchor="middle">Good crying</text>
  </g>

  <text x="28" y="546" font-size="11" font-weight="bold" fill="#880E4F">🎯 Late care (24 h): daily bath · check eyes/mouth/nose · temp · weight · warm ventilated room · treat early</text>
</svg>