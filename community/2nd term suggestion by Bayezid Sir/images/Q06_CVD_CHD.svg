<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Principal CVDs, CHD risk factors and prevention">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#A93226"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q6 · Cardiovascular Disease (CVD) &amp; CHD 🫀</text>
  <text x="29" y="56" font-size="13" fill="#f3c5c4">Principal CVDs · risk factors · WHO prevention strategies</text>

  <text x="28" y="88" font-size="14" font-weight="bold" fill="#A93226">Principal cardiovascular diseases</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="28" y="94" width="180" height="44" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="118" y="120" fill="#922B21" font-weight="bold">❤️ CHD / IHD</text>
    <rect x="220" y="94" width="180" height="44" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="310" y="120" fill="#922B21" font-weight="bold">🩸 Hypertension</text>
    <rect x="412" y="94" width="180" height="44" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="502" y="120" fill="#922B21" font-weight="bold">💜 RHD</text>
    <rect x="604" y="94" width="168" height="44" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="688" y="120" fill="#922B21" font-weight="bold">👶 Congenital heart</text>
  </g>

  <rect x="28" y="150" width="744" height="50" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/>
  <text x="46" y="172" font-size="13.5" font-weight="bold" fill="#922B21">🔴 CHD = impairment of heart function due to inadequate blood flow vs needs</text>
  <text x="46" y="190" font-size="12.5" fill="#7b241c">Caused by obstructive changes in coronary circulation · 30% of deaths in industrialised countries</text>

  <text x="28" y="218" font-size="14" font-weight="bold" fill="#A93226">⚠️ Risk factors → ↑ CHD risk</text>
  <g font-size="12">
    <rect x="28" y="232" width="180" height="32" rx="8" fill="#F4ECF7" stroke="#8E44AD"/><text x="118" y="252" fill="#6C3483" text-anchor="middle">🧬 Age ↑</text>
    <rect x="216" y="232" width="180" height="32" rx="8" fill="#F4ECF7" stroke="#8E44AD"/><text x="306" y="252" fill="#6C3483" text-anchor="middle">♂ Male sex</text>
    <rect x="404" y="232" width="180" height="32" rx="8" fill="#F4ECF7" stroke="#8E44AD"/><text x="494" y="252" fill="#6C3483" text-anchor="middle">👪 Family history</text>
    <rect x="592" y="232" width="180" height="32" rx="8" fill="#F4ECF7" stroke="#8E44AD"/><text x="682" y="252" fill="#6C3483" text-anchor="middle">🧬 Genetic · Type A</text>
  </g>
  <g font-size="12">
    <rect x="28" y="282" width="104" height="32" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="80" y="302" fill="#9C640C" text-anchor="middle">🚬 Smoking</text>
    <rect x="140" y="282" width="104" height="32" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="192" y="302" fill="#9C640C" text-anchor="middle">🩸 HTN</text>
    <rect x="252" y="282" width="104" height="32" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="304" y="302" fill="#9C640C" text-anchor="middle">🟡 Cholesterol</text>
    <rect x="364" y="282" width="104" height="32" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="416" y="302" fill="#9C640C" text-anchor="middle">🍬 Diabetes</text>
    <rect x="476" y="282" width="104" height="32" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="528" y="302" fill="#9C640C" text-anchor="middle">⚖️ Obesity</text>
  </g>
  <g font-size="12">
    <rect x="28" y="322" width="160" height="32" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="108" y="342" fill="#9C640C" text-anchor="middle">🪑 Sedentary habits</text>
    <rect x="196" y="322" width="160" height="32" rx="8" fill="#FEF9E7" stroke="#F39C12"/><text x="276" y="342" fill="#9C640C" text-anchor="middle">😰 Stress</text>
    <rect x="404" y="314" width="368" height="46" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.5"/>
    <text x="420" y="333" font-size="12.5" font-weight="bold" fill="#922B21">❤️ More modifiable factors = higher CHD risk</text>
    <text x="420" y="351" font-size="11.5" fill="#7b241c">LDL ↑, HDL ↓ → atherosclerosis → occlusion</text>
  </g>

  <text x="28" y="388" font-size="14" font-weight="bold" fill="#A93226">🛡 Prevention of CHD (WHO strategies)</text>
  <g font-size="12">
    <rect x="28" y="396" width="240" height="74" rx="10" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="44" y="416" font-size="12.5" font-weight="bold" fill="#1E8449">Primordial</text>
    <text x="44" y="436" fill="#145A32">Prevent emergence of risk</text>
    <text x="44" y="454" fill="#145A32">factors — best in childhood 🧒</text>

    <rect x="280" y="396" width="240" height="74" rx="10" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="296" y="416" font-size="12.5" font-weight="bold" fill="#1F618D">Primary</text>
    <text x="296" y="436" fill="#21618C">Diet ↓fat/cholesterol · no</text>
    <text x="296" y="454" fill="#21618C">smoking · BP control · activity</text>

    <rect x="532" y="396" width="240" height="74" rx="10" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="548" y="416" font-size="12.5" font-weight="bold" fill="#6C3483">Secondary</text>
    <text x="548" y="436" fill="#6C3483">Stop smoking · control HTN/DM</text>
    <text x="548" y="454" fill="#6C3483">β-blockers · aspirin · anticoag</text>
  </g>

  <rect x="28" y="486" width="744" height="54" rx="10" fill="#A93226" fill-opacity="0.08"/>
  <text x="46" y="509" font-size="13" font-weight="bold" fill="#7B241C">🎯 Principal CVD = CHD + HTN + RHD + congenital · Modifiable risk = smoking + HTN + cholesterol + DM + obesity + sedentary + stress</text>
  <text x="46" y="528" font-size="12.5" fill="#A93226">Prevention = diet + smoking control + BP control + exercise (primary) · screening + drugs (secondary)</text>
</svg>