<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Greenhouse effect, greenhouse gases, global warming and consequences for Bangladesh">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#F9A825"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q52 · Greenhouse Effect &amp; Global Warming 🌡</text>
  <text x="29" y="56" font-size="13" fill="#fff8e1">Greenhouse gases · mechanism · BD consequences · prevention</text>

  <text x="28" y="82" font-size="13.5" font-weight="bold" fill="#7D6608">🌡 Greenhouse effect — mechanism</text>
  <rect x="28" y="90" width="744" height="70" rx="9" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="46" y="112" font-size="11.5" fill="#7D6608">Short-wave <tspan font-weight="bold">solar</tspan> radiation passes through the atmosphere &amp; is absorbed by the earth's</text>
  <text x="46" y="128" font-size="11.5" fill="#7D6608">surface; the re-radiated <tspan font-weight="bold">long-wave infrared rays</tspan> are partially <tspan font-weight="bold">trapped</tspan> by</text>
  <text x="46" y="144" font-size="11.5" fill="#7D6608">greenhouse gases → progressive <tspan font-weight="bold">warming of the earth &amp; atmosphere</tspan></text>
  <text x="46" y="156" font-size="9.5" fill="#8D6E00" font-style="italic">The atmosphere plays the same role as the glass panes of a greenhouse.</text>

  <text x="28" y="176" font-size="13.5" font-weight="bold" fill="#7D6608">🎈 Greenhouse gases (share)</text>
  <g font-size="11">
    <rect x="28" y="184" width="220" height="42" fill="#C62828"/>
    <text x="138" y="210" fill="#ffffff" font-weight="bold" text-anchor="middle">CO₂ = 49% ★ principal</text>
    <rect x="256" y="184" width="180" height="42" fill="#E67E22"/>
    <text x="346" y="210" fill="#ffffff" font-weight="bold" text-anchor="middle">CH₄ = 18%</text>
    <rect x="444" y="184" width="160" height="42" fill="#2980B9"/>
    <text x="524" y="210" fill="#ffffff" font-weight="bold" text-anchor="middle">CFC = 14%</text>
    <rect x="612" y="184" width="160" height="42" fill="#27AE60"/>
    <text x="692" y="202" fill="#ffffff" font-weight="bold" text-anchor="middle">N₂O = 6%</text>
    <text x="692" y="218" fill="#eafaf1" text-anchor="middle" font-size="9">others 13%</text>
  </g>

  <g font-size="10.5">
    <rect x="28" y="236" width="360" height="76" rx="9" fill="#E8F5E9" stroke="#43A047"/>
    <text x="208" y="256" fill="#1B5E20" font-weight="bold" text-anchor="middle">Sources</text>
    <text x="44" y="274" fill="#2E7D32">CO₂ — vehicles, industry, fossil fuels, deforestation</text>
    <text x="44" y="288" fill="#2E7D32">CH₄ — paddy waste, marshy land, white ants</text>
    <text x="44" y="302" fill="#2E7D32">CFC — aerosols, refrigerants · N₂O — vehicles, power</text>
    <rect x="412" y="236" width="360" height="76" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="592" y="256" fill="#922B21" font-weight="bold" text-anchor="middle">🌍 Global warming prediction</text>
    <text x="428" y="274" fill="#7b241c">~3°C rise in global surface temp by 2030</text>
    <text x="428" y="288" fill="#7b241c">sea-level +0.1–0.3 m by 2050 · more cyclones,</text>
    <text x="428" y="302" fill="#7b241c">heat waves · grain decline · vector change</text>
  </g>

  <text x="28" y="328" font-size="13.5" font-weight="bold" fill="#7D6608">🇧🇩 Consequences of greenhouse effect on Bangladesh</text>
  <g font-size="11">
    <rect x="28" y="336" width="240" height="86" rx="9" fill="#FDEBD0" stroke="#E67E22"/><text x="148" y="354" fill="#9C640C" font-weight="bold" text-anchor="middle">Sea-level rise 🌊</text><text x="44" y="372" fill="#7E5109">~3 ft by mid-century</text><text x="44" y="386" fill="#7E5109">· 6–9 ft later</text><text x="44" y="400" fill="#7E5109">Barisal &amp; Khulna islands</text><text x="44" y="414" fill="#7E5109"></text>
    <rect x="280" y="336" width="240" height="86" rx="9" fill="#EBF5FB" stroke="#2980B9"/><text x="400" y="354" fill="#1F618D" font-weight="bold" text-anchor="middle">Salinity 🧂</text><text x="296" y="372" fill="#21618C">of all major rivers &amp; tributaries</text><text x="296" y="386" fill="#21618C">paddy → shrimp cultivation</text><text x="296" y="400" fill="#21618C">coastal greenery dies</text><text x="296" y="414" fill="#21618C"></text>
    <rect x="532" y="336" width="240" height="86" rx="9" fill="#FDECEC" stroke="#C0392B"/><text x="652" y="354" fill="#922B21" font-weight="bold" text-anchor="middle">Disasters &amp; Sundarbans 🌴</text><text x="548" y="372" fill="#7b241c">more violent floods, cyclones, tidal</text><text x="548" y="386" fill="#7b241c">bores · Sundarbans submerge</text><text x="548" y="400" fill="#7b241c">crop loss · wildlife declines</text><text x="548" y="414" fill="#7b241c"></text>
  </g>

  <text x="28" y="440" font-size="13.5" font-weight="bold" fill="#7D6608">🛡 Prevention of greenhouse effect</text>
  <g font-size="11">
    <rect x="28" y="448" width="240" height="50" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="148" y="466" fill="#145A32" font-weight="bold" text-anchor="middle">Reduce CO₂ 🔋</text><text x="44" y="484" fill="#1E8449">conserve fuel energy · fuel-efficient</text><text x="44" y="498" fill="#1E8449">engines · renewable energy</text>
    <rect x="280" y="448" width="240" height="50" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="400" y="466" fill="#145A32" font-weight="bold" text-anchor="middle">Trees 🌳</text><text x="296" y="484" fill="#1E8449">conservation + afforestation</text><text x="296" y="498" fill="#1E8449">organic manure over chemical</text>
    <rect x="532" y="448" width="240" height="50" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="652" y="466" fill="#145A32" font-weight="bold" text-anchor="middle">Stop CFC + coast ⛰</text><text x="548" y="484" fill="#1E8449">ban CFC · cheap substitutes ·</text><text x="548" y="498" fill="#1E8449">dams &amp; walls in coastal areas</text>
  </g>

  <rect x="28" y="512" width="744" height="32" rx="8" fill="#FF8F00" fill-opacity="0.12"/>
  <text x="46" y="534" font-size="12" font-weight="bold" fill="#7D6608">🎯 CO₂ = 49% (principal) · global warming ~3°C by 2030 · BD = sea rise + salinity + floods + Sundarbans loss · Prevent: reduce CO₂ + trees + stop CFC</text>
</svg>