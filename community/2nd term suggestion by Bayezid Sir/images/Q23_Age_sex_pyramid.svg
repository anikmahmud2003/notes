  <g font-size="10" fill="#95A5A6">
    <text x="35" y="141" text-anchor="end">80+</text>
    <text x="35" y="169" text-anchor="end">70-79</text>
    <text x="35" y="197" text-anchor="end">60-69</text>
    <text x="35" y="225" text-anchor="end">50-59</text>
    <text x="35" y="253" text-anchor="end">40-49</text>
    <text x="35" y="281" text-anchor="end">30-39</text>
    <text x="35" y="309" text-anchor="end">20-29</text>
    <text x="35" y="337" text-anchor="end">10-19</text>
    <text x="35" y="365" text-anchor="end">0-9</text>
    <text x="765" y="141" text-anchor="start">80+</text>
    <text x="765" y="169" text-anchor="start">70-79</text>
    <text x="765" y="197" text-anchor="start">60-69</text>
    <text x="765" y="225" text-anchor="start">50-59</text>
    <text x="765" y="253" text-anchor="start">40-49</text>
    <text x="765" y="281" text-anchor="start">30-39</text>
    <text x="765" y="309" text-anchor="start">20-29</text>
    <text x="765" y="337" text-anchor="start">10-19</text>
    <text x="765" y="365" text-anchor="start">0-9</text>
  </g>

  <g font-size="12">
    <rect x="40" y="408" width="300" height="62" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="56" y="428" font-weight="bold" fill="#922B21">Wide base · narrow apex</text>
    <text x="56" y="446" fill="#7b241c">→ many children (0–15 yr)</text>
    <text x="56" y="462" fill="#7b241c">→ rapid future growth · ⚠ high</text>
    <text x="56" y="478" fill="#7b241c">  dependency ratio (&gt;97)</text>

    <rect x="460" y="408" width="300" height="62" rx="9" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="476" y="428" font-weight="bold" fill="#1E8449">Narrow base · body bulge</text>
    <text x="476" y="446" fill="#145A32">→ mostly middle-aged</text>
    <text x="476" y="462" fill="#145A32">→ planned / stable growth</text>
    <text x="476" y="478" fill="#145A32">→ aging population</text>
  </g>

  <rect x="28" y="486" width="744" height="34" rx="10" fill="#F4F6F7" stroke="#95A5A6"/>
  <text x="46" y="507" font-size="12.5" fill="#5D6D7E">💡 Importance: shows planned vs unplanned growth · most people in developing countries are children</text>
  <text x="46" y="520" font-size="12" fill="#5D6D7E">· health services in developing countries inadequate vs adequate in developed</text>

  <rect x="28" y="532" width="744" height="18" rx="6" fill="#34495E" fill-opacity="0.08"/>
  <text x="46" y="545" font-size="11.5" font-weight="bold" fill="#2C3E50">🎯 Developing = wide base + narrow apex (young, rapid growth) · Developed = middle bulge (aging, stable)</text>
</svg>