<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Age-sex pyramids of developing and developed countries">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#34495E"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q23 · Age-Sex Pyramid 👥</text>
  <text x="29" y="56" font-size="13" fill="#b7c8dc">Visual presentation of population by age &amp; sex</text>

  <g font-size="12">
    <rect x="40" y="88" width="300" height="26" rx="6" fill="#C0392B"/>
    <text x="190" y="106" fill="#ffffff" font-weight="bold" text-anchor="middle">🇧🇩 DEVELOPING (Bangladesh)</text>
    <rect x="460" y="88" width="300" height="26" rx="6" fill="#1E8449"/>
    <text x="610" y="106" fill="#ffffff" font-weight="bold" text-anchor="middle">🇪🇺 DEVELOPED</text>
  </g>

  <g font-size="10.5">
    <line x1="190" y1="126" x2="190" y2="396" stroke="#D5DBDB"/>
    <line x1="610" y1="126" x2="610" y2="396" stroke="#D5DBDB"/>
  </g>

  <g fill="#5DADE2">
