    <rect x="245" y="210" width="55" height="24" fill="#C0392B"/>
    <rect x="120" y="238" width="70" height="24" fill="#C0392B"/>
    <rect x="260" y="238" width="70" height="24" fill="#C0392B"/>
    <rect x="105" y="266" width="85" height="24" fill="#C0392B"/>
    <rect x="275" y="266" width="85" height="24" fill="#C0392B"/>
    <rect x="85" y="294" width="105" height="24" fill="#C0392B"/>
    <rect x="295" y="294" width="105" height="24" fill="#C0392B"/>
    <rect x="60" y="322" width="130" height="24" fill="#C0392B"/>
    <rect x="320" y="322" width="130" height="24" fill="#C0392B"/>
    <rect x="40" y="350" width="150" height="24" fill="#C0392B"/>
    <rect x="340" y="350" width="150" height="24" fill="#C0392B"/>
  </g>

  <g fill="#2ECC71">
    <rect x="153" y="126" width="37" height="24" fill="#1E8449"/>
    <rect x="227" y="126" width="37" height="24" fill="#1E8449"/>
    <rect x="130" y="154" width="60" height="24" fill="#1E8449"/>
    <rect x="250" y="154" width="60" height="24" fill="#1E8449"/>
    <rect x="105" y="182" width="85" height="24" fill="#1E8449"/>
    <rect x="275" y="182" width="85" height="24" fill="#1E8449"/>
    <rect x="85" y="210" width="105" height="24" fill="#1E8449"/>
    <rect x="295" y="210" width="105" height="24" fill="#1E8449"/>
