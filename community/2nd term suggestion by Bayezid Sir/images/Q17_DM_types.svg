<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Diabetes mellitus definition and comparison of type 1 and type 2">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#2E86C1"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q17 · Diabetes Mellitus (DM) 🍬</text>
  <text x="29" y="56" font-size="13" fill="#d4e6f1">Definition · classification · Type-1 vs Type-2</text>

  <rect x="28" y="86" width="744" height="56" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/>
  <text x="46" y="108" font-size="13.5" font-weight="bold" fill="#922B21">🔴 DM = absolute (↓insulin secretion) or relative (↓insulin action) deficiency of insulin</text>
  <text x="46" y="127" font-size="12.5" fill="#7b241c">→ chronic metabolic disorder with raised blood glucose (hyperglycaemia)</text>

  <text x="28" y="160" font-size="14" font-weight="bold" fill="#2E86C1">📚 WHO clinical classification</text>
  <g font-size="12">
    <rect x="28" y="168" width="240" height="58" rx="9" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="44" y="188" font-weight="bold" fill="#1F618D">1 · Diabetes mellitus</text>
    <text x="44" y="206" fill="#21618C">IDDM · NIDDM · MRDM</text>
    <text x="44" y="222" fill="#21618C">other secondary types</text>
    <rect x="280" y="168" width="240" height="58" rx="9" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="296" y="188" font-weight="bold" fill="#9C640C">2 · Impaired glucose</text>
    <text x="296" y="206" fill="#7E5109">tolerance (IGT)</text>
    <text x="296" y="224" fill="#7E5109">borderline state ⚖️</text>
    <rect x="532" y="168" width="240" height="58" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="548" y="188" font-weight="bold" fill="#6C3483">3 · Gestational DM</text>
    <text x="548" y="206" fill="#6C3483">(GDM)</text>
    <text x="548" y="224" fill="#6C3483">first in pregnancy 🤰</text>
  </g>

  <text x="28" y="248" font-size="14" font-weight="bold" fill="#2E86C1">⚔️ Type-1 vs Type-2 DM</text>
  <g font-size="12">
    <rect x="28" y="256" width="372" height="218" rx="10" fill="#EBF5FB" stroke="#2980B9" stroke-width="2"/>
    <text x="214" y="278" font-size="14" font-weight="bold" fill="#1F618D" text-anchor="middle">TYPE-1 (IDDM)</text>
    <text x="44" y="302" fill="#21618C">• Onset: abrupt · age usually &lt;30 yr</text>
    <text x="44" y="324" fill="#21618C">• Body build: lean</text>
    <text x="44" y="346" fill="#21618C">• Insulin: very low/absent</text>
    <text x="44" y="368" fill="#21618C">• Ketoacidosis: common</text>
    <text x="44" y="390" fill="#21618C">• Proportion: 5–10%</text>
    <text x="44" y="412" fill="#21618C">• Autoantibodies: present · HLA association</text>
    <text x="44" y="434" fill="#21618C">• Treatment: insulin essential 💉</text>
    <text x="44" y="458" fill="#154360" font-weight="bold">→ lethal if treatment is late</text>

    <rect x="412" y="256" width="360" height="218" rx="10" fill="#FEF9E7" stroke="#F39C12" stroke-width="2"/>
    <text x="592" y="278" font-size="14" font-weight="bold" fill="#9C640C" text-anchor="middle">TYPE-2 (NIDDM)</text>
    <text x="428" y="302" fill="#7E5109">• Onset: gradual · age usually &gt;40 yr</text>
    <text x="428" y="324" fill="#7E5109">• Body build: obese</text>
    <text x="428" y="346" fill="#7E5109">• Insulin: normal/high (resistance)</text>
    <text x="428" y="368" fill="#7E5109">• Ketoacidosis: rare</text>
    <text x="428" y="390" fill="#7E5109">• Proportion: 90–95%</text>
    <text x="428" y="412" fill="#7E5109">• Autoantibodies: absent</text>
    <text x="428" y="434" fill="#7E5109">• Treatment: diet + oral agents ± insulin</text>
    <text x="428" y="458" fill="#9C640C" font-weight="bold">→ long compatible survival</text>
  </g>

  <rect x="28" y="490" width="744" height="54" rx="10" fill="#F4F6F7" stroke="#95A5A6"/>
  <text x="46" y="512" font-size="13" fill="#5D6D7E">🧪 <tspan font-weight="bold">Classical symptoms:</tspan> Polyuria + Polydipsia + Polyphagia + weight loss + general weakness</text>

  <rect x="28" y="538" width="744" height="16" rx="6" fill="#2E86C1" fill-opacity="0.08"/>
  <text x="46" y="549" font-size="11.5" font-weight="bold" fill="#154360">🎯 Type-1 = young·lean·autoimmune·insulin-dependent (5–10%) · Type-2 = old·obese·insulin-resistant (90–95%)</text>
</svg>