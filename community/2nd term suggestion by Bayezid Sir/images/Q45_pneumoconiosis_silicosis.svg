<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Prevention of occupational hazards, pneumoconiosis, farmer's lung and silicosis">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#37474F"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q45 · Prevention &amp; Pneumoconiosis 🌫</text>
  <text x="29" y="56" font-size="13" fill="#cfd8dc">Medical + engineering + legislation · dust diseases · farmer's lung · silicosis</text>

  <text x="28" y="84" font-size="14" font-weight="bold" fill="#37474F">🛡 Prevention of occupational hazards</text>
  <g font-size="11">
    <rect x="28" y="92" width="240" height="126" rx="9" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="148" y="112" fill="#1F618D" font-weight="bold" text-anchor="middle">A · Medical measures 👩‍⚕️</text>
    <text x="44" y="130" fill="#21618C">1 Pre-placement exam = right man,</text>
    <text x="44" y="144" fill="#21618C">right job + baseline</text>
    <text x="44" y="158" fill="#21618C">2 Periodical exam — yearly / monthly</text>
    <text x="44" y="172" fill="#21618C">3 Medical &amp; health care services</text>
    <text x="44" y="186" fill="#21618C">4 Notification of occupational diseases</text>
    <text x="44" y="200" fill="#21618C">5 Supervision &amp; records · health</text>
    <text x="44" y="214" fill="#21618C">education &amp; counselling</text>

    <rect x="280" y="92" width="240" height="126" rx="9" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="400" y="112" fill="#145A32" font-weight="bold" text-anchor="middle">B · Engineering measures 🛠</text>
    <text x="296" y="130" fill="#1E8449">1 Building design · 2 good housekeeping</text>
    <text x="296" y="144" fill="#1E8449">3 Ventilation · 4 mechanization</text>
    <text x="296" y="158" fill="#1E8449">5 Substitution (safe material)</text>
    <text x="296" y="172" fill="#1E8449">6 Dust control · 7 enclosure · 8 isolation</text>
    <text x="296" y="186" fill="#1E8449">9 Local exhaust ventilation</text>
    <text x="296" y="200" fill="#1E8449">10 PPE (respirator, mask, helmet…)</text>
    <text x="296" y="214" fill="#1E8449">11 monitoring · 12 statistics · 13 research</text>

    <rect x="532" y="92" width="240" height="126" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="652" y="112" fill="#6C3483" font-weight="bold" text-anchor="middle">C · Legislation ⚖</text>
    <text x="548" y="130" fill="#6C3483">Factory (Amendment) Act 1965</text>
    <text x="548" y="146" fill="#6C3483">Workmen's Compensation Act 1923</text>
    <text x="548" y="164" fill="#6C3483"></text>
    <text x="548" y="182" fill="#6C3483" font-weight="bold">Also in BD:</text>
    <text x="548" y="198" fill="#6C3483">Tea Plantation 1962 · Maternity</text>
    <text x="548" y="212" fill="#6C3483">Benefit 1939 · Shops &amp; Estab. 1965</text>
  </g>

  <text x="28" y="236" font-size="14" font-weight="bold" fill="#37474F">🌫 Pneumoconiosis — dust &amp; disease</text>
  <rect x="28" y="244" width="744" height="30" rx="8" fill="#FDECEC" stroke="#C0392B"/>
  <text x="46" y="263" font-size="11.5" fill="#922B21">🔴 Lung disease from dust <tspan font-weight="bold">0.5–3 μm</tspan> → lung fibrosis · ↑ working capacity ↓ · no cure, prevention only</text>

  <g font-size="11">
    <rect x="28" y="282" width="186" height="52" rx="8" fill="#ECEFF1" stroke="#546E7A"/>
    <rect x="42" y="294" width="84" height="26" rx="6" fill="#FDECEC"/>
    <text x="150" y="300" fill="#7b241c" font-size="10" text-anchor="middle">Dust</text>
    <text x="150" y="316" fill="#37474F" font-size="10" text-anchor="middle">Disease</text>
    <rect x="28" y="334" width="186" height="24" fill="#F4F6F7"/><text x="44" y="351" fill="#5D6D7E">Coal → anthracosis</text>
    <rect x="28" y="358" width="186" height="24" fill="#F4F6F7"/><text x="44" y="375" fill="#5D6D7E">Silica → silicosis</text>
    <rect x="28" y="382" width="186" height="24" fill="#F4F6F7"/><text x="44" y="399" fill="#5D6D7E">Asbestos → asbestosis</text>
    <rect x="28" y="406" width="186" height="24" fill="#F4F6F7"/><text x="44" y="423" fill="#5D6D7E">Iron → siderosis</text>
    <rect x="28" y="430" width="186" height="24" fill="#F4F6F7"/><text x="44" y="447" fill="#5D6D7E">Cotton → byssinosis</text>
    <rect x="28" y="454" width="186" height="24" fill="#F4F6F7"/><text x="44" y="471" fill="#5D6D7E">Cane fibre → bagassosis</text>
    <rect x="28" y="478" width="186" height="24" fill="#F4F6F7"/><text x="44" y="495" fill="#5D6D7E">Hay/grain → farmer's lung</text>

    <rect x="226" y="282" width="240" height="96" rx="9" fill="#FDF2E9" stroke="#D68910"/>
    <text x="346" y="302" fill="#9C640C" font-weight="bold" text-anchor="middle">🌾 Farmer's lung</text>
    <text x="242" y="320" fill="#7E5109">= occupational disease from mouldy hay/</text>
    <text x="242" y="334" fill="#7E5109">grain dust · moisture &gt;30% → bacteria/</text>
    <text x="242" y="348" fill="#7E5109">fungi grow, 40–50°C → thermophilic</text>
    <text x="242" y="362" fill="#7E5109">actinomycetes → <tspan font-weight="bold">M. faeni</tspan> 🔬</text>
    <text x="242" y="376" fill="#7E5109"></text>
    <rect x="226" y="386" width="240" height="116" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="346" y="406" fill="#6C3483" font-weight="bold" text-anchor="middle">Acute &amp; chronic course</text>
    <text x="242" y="424" fill="#6C3483">Acute: fever, headache, malaise, muscle pain</text>
    <text x="242" y="438" fill="#6C3483">· dry cough + breathlessness W/O wheeze</text>
    <text x="242" y="452" fill="#6C3483">Repeated attacks → pulmonary fibrosis →</text>
    <text x="242" y="466" fill="#6C3483">inevitable lung damage → <tspan font-weight="bold">cor pulmonale</tspan></text>
    <text x="242" y="480" fill="#6C3483"></text>
    <text x="242" y="496" fill="#6C3483"></text>

    <rect x="478" y="282" width="294" height="220" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="625" y="302" fill="#922B21" font-weight="bold" text-anchor="middle">🪨 Silicosis</text>
    <text x="494" y="320" fill="#7b241c">Cause: free silica (SiO₂) dust — mining,</text>
    <text x="494" y="334" fill="#7b241c">pottery, sand blasting, metal grinding</text>
    <text x="494" y="348" fill="#7b241c">Particles 0.5–3 μm → phagocytes → block</text>
    <text x="494" y="362" fill="#7b241c">lymphatics → dense nodular fibrosis</text>
    <text x="494" y="376" fill="#7b241c">Incubation: months–years</text>
    <text x="494" y="392" fill="#7b241c">Symptoms: dry cough, dyspnoea, chest pain</text>
    <text x="494" y="406" fill="#7b241c">X-ray: <tspan font-weight="bold">"snow-storm" appearance ❄</tspan></text>
    <text x="494" y="424" fill="#B03A2E" font-weight="bold">★ major occupational cause of permanent</text>
    <text x="494" y="438" fill="#B03A2E" font-weight="bold">disability &amp; mortality</text>
    <text x="494" y="456" fill="#7b241c">Control: dust control (substitution,</text>
    <text x="494" y="470" fill="#7b241c">enclosure, isolation, hydro-blasting,</text>
    <text x="494" y="484" fill="#7b241c">housekeeping, PPE) + regular exam</text>
    <text x="494" y="498" fill="#7b241c"></text>
  </g>
</svg>