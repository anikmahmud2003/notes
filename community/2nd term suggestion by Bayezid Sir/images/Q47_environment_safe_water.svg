<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Environment classification, safe and wholesome water, water-borne and water-related diseases">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#558B2F"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q47 · Environment &amp; Safe Water 🌍💧</text>
  <text x="29" y="56" font-size="13" fill="#e8efd8">Environment · safe water · water-borne &amp; water-related disease</text>

  <text x="28" y="86" font-size="13.5" font-weight="bold" fill="#558B2F">🌍 Environment — definition &amp; classification</text>
  <rect x="28" y="94" width="744" height="26" rx="7" fill="#F1F8E9" stroke="#558B2F"/>
  <text x="46" y="111" font-size="11.5" fill="#33691E">🔴 All external factors — living &amp; non-living, material &amp; non-material — which surround man</text>
  <g font-size="11">
    <rect x="28" y="128" width="232" height="46" rx="8" fill="#F4F6F7" stroke="#95A5A6"/><text x="144" y="147" fill="#5D6D7E" font-weight="bold" text-anchor="middle">Internal 🫀</text><text x="144" y="164" fill="#5D6D7E" text-anchor="middle">tissues · organs · organ systems</text>
    <rect x="284" y="128" width="232" height="46" rx="8" fill="#F4F6F7" stroke="#95A5A6"/><text x="400" y="147" fill="#5D6D7E" font-weight="bold" text-anchor="middle">External / macro 🌏</text><text x="400" y="164" fill="#5D6D7E" text-anchor="middle">air · water · food · housing</text>
    <rect x="540" y="128" width="232" height="46" rx="8" fill="#F4F6F7" stroke="#95A5A6"/><text x="656" y="147" fill="#5D6D7E" font-weight="bold" text-anchor="middle">3 components 🗂</text><text x="656" y="164" fill="#5D6D7E" text-anchor="middle">physical · biological · social</text>
  </g>

  <text x="28" y="194" font-size="13.5" font-weight="bold" fill="#558B2F">💧 Safe &amp; wholesome water (4 requisites)</text>
  <g font-size="11">
    <rect x="28" y="202" width="180" height="52" rx="8" fill="#E8F5E9" stroke="#43A047"/>
    <circle cx="58" cy="222" r="13" fill="#A5D6A7"/><text x="58" y="227" fill="#1B5E20" font-weight="bold" text-anchor="middle">1</text>
    <text x="80" y="222" fill="#1B5E20" font-weight="bold">Free from</text>
    <text x="80" y="238" fill="#2E7D32">pathogenic agents</text>
    <rect x="216" y="202" width="180" height="52" rx="8" fill="#E8F5E9" stroke="#43A047"/>
    <circle cx="246" cy="222" r="13" fill="#A5D6A7"/><text x="246" y="227" fill="#1B5E20" font-weight="bold" text-anchor="middle">2</text>
    <text x="268" y="222" fill="#1B5E20" font-weight="bold">No harmful</text>
    <text x="268" y="238" fill="#2E7D32">chemical substances</text>
    <rect x="404" y="202" width="180" height="52" rx="8" fill="#E8F5E9" stroke="#43A047"/>
    <circle cx="434" cy="222" r="13" fill="#A5D6A7"/><text x="434" y="227" fill="#1B5E20" font-weight="bold" text-anchor="middle">3</text>
    <text x="456" y="222" fill="#1B5E20" font-weight="bold">Pleasant to taste</text>
    <text x="456" y="238" fill="#2E7D32">free of colour &amp; odour</text>
    <rect x="592" y="202" width="180" height="52" rx="8" fill="#E8F5E9" stroke="#43A047"/>
    <circle cx="622" cy="222" r="13" fill="#A5D6A7"/><text x="622" y="227" fill="#1B5E20" font-weight="bold" text-anchor="middle">4</text>
    <text x="644" y="222" fill="#1B5E20" font-weight="bold">Usable for</text>
    <text x="644" y="238" fill="#2E7D32">domestic purposes</text>
  </g>

  <rect x="28" y="262" width="744" height="24" rx="7" fill="#F1F8E9"/>
  <text x="46" y="278" font-size="11" fill="#33691E">Need: basic ~2 L/head/day · adequate 150–200 L/head/day · sources: rain · surface (rivers, ponds, tanks) · ground (tube wells, springs) · 🎯 tube well = best &amp; cheapest</text>

  <text x="28" y="302" font-size="13.5" font-weight="bold" fill="#558B2F">🦠 Water-borne diseases (biological hazards)</text>
  <g font-size="11">
    <rect x="28" y="310" width="240" height="92" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="148" y="330" fill="#922B21" font-weight="bold" text-anchor="middle">A · Infective agent</text>
    <text x="44" y="348" fill="#7b241c">Viral: hepatitis A &amp; E, polio, rotavirus</text>
    <text x="44" y="364" fill="#7b241c">Bacterial: typhoid, cholera, dysentery</text>
    <text x="44" y="380" fill="#7b241c">Protozoal: amoebiasis, giardiasis</text>
    <text x="44" y="396" fill="#7b241c">Helminthic: round-worm · leptospiral: Weil's</text>

    <rect x="280" y="310" width="240" height="92" rx="9" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="400" y="330" fill="#1F618D" font-weight="bold" text-anchor="middle">B · Aquatic host 🐚</text>
    <text x="296" y="348" fill="#21618C">Cyclops vector:</text>
    <text x="296" y="364" fill="#21618C">Guinea worm (dracunculiasis)</text>
    <text x="296" y="380" fill="#21618C">fish tape-worm</text>
    <text x="296" y="396" fill="#21618C">Snail vector: schistosomiasis</text>

    <rect x="532" y="310" width="240" height="92" rx="9" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="652" y="330" fill="#9C640C" font-weight="bold" text-anchor="middle">☣ Chemical hazards</text>
    <text x="548" y="348" fill="#7E5109">Excess fluoride → fluorosis</text>
    <text x="548" y="364" fill="#7E5109">Pb salts → plumbism</text>
    <text x="548" y="380" fill="#7E5109">Nitrate → infantile methaemoglobinaemia</text>
    <text x="548" y="396" fill="#7E5109">Iodine lack → goitre · Zn/Fe → constipation</text>
  </g>

  <rect x="28" y="414" width="744" height="30" rx="8" fill="#F1F8E9"/>
  <text x="46" y="433" font-size="11.5" fill="#33691E">📌 Sanitation (WHO) = control of physical-environment factors that may deleteriously affect health · "clean home, clean farm, clean community"</text>

  <rect x="28" y="456" width="744" height="60" rx="9" fill="#E8F5E9" stroke="#43A047"/>
  <text x="46" y="478" font-size="11.5" fill="#1B5E20">💡 Key exam pairs — water-borne infections transmitted faeco-orally (ingestion):</text>
  <text x="46" y="496" font-size="11" fill="#2E7D32">Cholera · typhoid · hepatitis A/E · polio · amoebiasis · giardiasis · round-worm</text>
  <text x="46" y="512" font-size="11" fill="#2E7D32">WHO = safe water + sanitation + hygiene (WaSH) prevents the whole family</text>

  <rect x="28" y="528" width="744" height="22" rx="7" fill="#558B2F" fill-opacity="0.08"/>
  <text x="46" y="543" font-size="11.5" font-weight="bold" fill="#33691E">🎯 Environment = physical+biological+social · Safe water = pathogen-free + chemical-free + pleasant + usable ✅</text>
</svg>