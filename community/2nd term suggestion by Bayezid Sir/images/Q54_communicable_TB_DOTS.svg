<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Communicable disease definition, incubation period, tuberculosis DOTS and prevention">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#6A1B9A"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q54 · Communicable Disease · TB &amp; DOTS 🦠</text>
  <text x="29" y="56" font-size="13" fill="#e1bee7">Definition · incubation period · DOTS · prevention principles</text>

  <rect x="28" y="82" width="744" height="42" rx="10" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="2"/>
  <text x="46" y="100" font-size="11.5" fill="#4A148C">🔴 Illness due to an <tspan font-weight="bold">infectious agent or toxic products</tspan>, transmitted directly/indirectly</text>
  <text x="46" y="117" font-size="11.5" fill="#4A148C">man→man, animal→animal, or environment→man/animal</text>
  <text x="46" y="129" font-size="10" fill="#6A1B9A">Triad: Agent = seed · Host = soil · Route = climate</text>

  <text x="28" y="140" font-size="13.5" font-weight="bold" fill="#6A1B9A">⏱ Incubation period — key values</text>
  <g font-size="10.5">
    <rect x="28" y="148" width="180" height="130" rx="9" fill="#F4F6F7" stroke="#95A5A6"/>
    <text x="118" y="166" fill="#5D6D7E" font-weight="bold" text-anchor="middle">Disease</text>
    <text x="44" y="184" fill="#5D6D7E">Influenza — 1–3 d</text>
    <text x="44" y="199" fill="#5D6D7E">Dengue — 2–4 d</text>
    <text x="44" y="214" fill="#5D6D7E">Cholera — hrs–5 d</text>
    <text x="44" y="229" fill="#5D6D7E">Typhoid — 10–14 d</text>
    <text x="44" y="244" fill="#5D6D7E">Mumps — ~18 d</text>
    <text x="44" y="259" fill="#5D6D7E">Measles — 10–14 d</text>
    <text x="44" y="273" fill="#5D6D7E">Rabies — 3–8 wks, TB — wks–yrs</text>
    <rect x="220" y="148" width="552" height="130" rx="9" fill="#F3E5F5" stroke="#6A1B9A"/>
    <text x="496" y="168" fill="#4A148C" font-weight="bold" text-anchor="middle">🔴 Definition</text>
    <text x="236" y="186" fill="#6A1B9A">Time interval between the <tspan font-weight="bold">entry of the pathogen</tspan></text>
    <text x="236" y="200" fill="#6A1B9A">into the body and the <tspan font-weight="bold">appearance of the first</tspan></text>
    <text x="236" y="214" fill="#6A1B9A">symptom or sign of the disease</text>
    <text x="236" y="234" fill="#6A1B9A"></text>
    <text x="236" y="252" fill="#6A1B9A">🎯 Longest = TB (wks–years) · Rabies highly variable</text>
    <text x="236" y="266" fill="#6A1B9A">DST = dengue serotypes</text>
  </g>

  <text x="28" y="296" font-size="13.5" font-weight="bold" fill="#6A1B9A">🫁 TB &amp; DOTS (BD since 1993)</text>
  <rect x="28" y="304" width="744" height="30" rx="8" fill="#FDECEC" stroke="#C0392B"/>
  <text x="46" y="324" font-size="11.5" fill="#922B21">🔴 <tspan font-weight="bold">DOTS</tspan> = Directly Observed Treatment, Short-course — health worker <tspan font-weight="bold">watches each dose</tspan> being taken</text>

  <g font-size="10.5">
    <rect x="28" y="342" width="360" height="120" rx="9" fill="#F3E5F5" stroke="#6A1B9A"/>
    <text x="208" y="360" fill="#4A148C" font-weight="bold" text-anchor="middle">5 elements</text>
    <text x="44" y="378" fill="#6A1B9A">1 Political commitment</text>
    <text x="44" y="392" fill="#6A1B9A">2 Reliable microscopy (sputum smear)</text>
    <text x="44" y="406" fill="#6A1B9A">3 Standardized multi-drug direct observance</text>
    <text x="44" y="420" fill="#6A1B9A">4 Adequate drug supply</text>
    <text x="44" y="434" fill="#6A1B9A">5 Proper recording &amp; reporting</text>
    <text x="44" y="448" fill="#4A148C">DOT agent: MPWs, volunteers, BRAC (BD)</text>
    <rect x="412" y="342" width="360" height="120" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="592" y="360" fill="#922B21" font-weight="bold" text-anchor="middle">Regimen (category I — new case)</text>
    <text x="428" y="380" fill="#7b241c"><tspan font-weight="bold">Intensive 2 months:</tspan> 2HRZE</text>
    <text x="428" y="394" fill="#7b241c">(Isoniazid + Rifampicin + Pyrazinamide</text>
    <text x="428" y="408" fill="#7b241c">+ Ethambutol)</text>
    <text x="428" y="424" fill="#7b241c"><tspan font-weight="bold">Continuation 4 months:</tspan> 4HR</text>
    <text x="428" y="438" fill="#7b241c">Total = 6 months (8 mo retreatment)</text>
    <text x="428" y="456" fill="#B03A2E" font-weight="bold">2HRZE / 4HR</text>
  </g>

  <text x="28" y="480" font-size="13.5" font-weight="bold" fill="#6A1B9A">🛡 Prevention &amp; control of communicable diseases</text>
  <g font-size="10.5">
    <rect x="28" y="488" width="180" height="56" rx="8" fill="#EAFAF1" stroke="#27AE60"/>
    <text x="118" y="506" fill="#145A32" font-weight="bold" text-anchor="middle">1 Reservoir 🎭</text>
    <text x="44" y="522" fill="#1E8449">early diag · notify · isolate</text>
    <text x="44" y="537" fill="#1E8449">treat · quarantine · carriers</text>
    <rect x="216" y="488" width="180" height="56" rx="8" fill="#EBF5FB" stroke="#2980B9"/>
    <text x="306" y="506" fill="#1F618D" font-weight="bold" text-anchor="middle">2 Transmission 🔁</text>
    <text x="232" y="522" fill="#21618C">water treatment · vector control</text>
    <text x="232" y="537" fill="#21618C">hygiene · safe sex</text>
    <rect x="404" y="488" width="180" height="56" rx="8" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="494" y="506" fill="#6C3483" font-weight="bold" text-anchor="middle">3 Host 🧍</text>
    <text x="420" y="522" fill="#6C3483">immunization · chemoprophylaxis</text>
    <text x="420" y="537" fill="#6C3483">non-specific measures</text>
    <rect x="592" y="488" width="180" height="56" rx="8" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="682" y="506" fill="#9C640C" font-weight="bold" text-anchor="middle">4 Microbes 🧫</text>
    <text x="608" y="522" fill="#7E5109">disinfection &amp;</text>
    <text x="608" y="537" fill="#7E5109">sterilization</text>
  </g>
</svg>