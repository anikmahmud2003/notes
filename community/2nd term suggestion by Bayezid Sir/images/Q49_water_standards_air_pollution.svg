<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="WHO drinking water standards, bacteriological standards, coliform indicator and air pollution health effects">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#558B2F"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q49 · Water Standards &amp; Air Pollution 💨</text>
  <text x="29" y="56" font-size="13" fill="#e8efd8">WHO water criteria · bacteriological standards · coliform · air pollution effects</text>

  <text x="28" y="84" font-size="13.5" font-weight="bold" fill="#558B2F">🥤 WHO drinking-water quality — physical &amp; chemical</text>
  <g font-size="10.5">
    <rect x="28" y="92" width="240" height="96" rx="9" fill="#E8F5E9" stroke="#43A047"/>
    <text x="148" y="112" fill="#1B5E20" font-weight="bold" text-anchor="middle">Acceptability (physical)</text>
    <text x="44" y="130" fill="#2E7D32">1 Free from turbidity</text>
    <text x="44" y="144" fill="#2E7D32">2 Colourless</text>
    <text x="44" y="158" fill="#2E7D32">3 Pleasant taste &amp; odour</text>
    <text x="44" y="172" fill="#2E7D32">4 Acceptable temperature</text>
    <text x="44" y="186" fill="#2E7D32"></text>
    <rect x="280" y="92" width="240" height="96" rx="9" fill="#FEF9E7" stroke="#F39C12"/>
    <text x="400" y="112" fill="#9C640C" font-weight="bold" text-anchor="middle">Inorganic (chemical) mg/L</text>
    <text x="296" y="130" fill="#7E5109">Chloride 200 · Sodium 200</text>
    <text x="296" y="144" fill="#7E5109">Iron 0.1 · Manganese &lt;0.3</text>
    <text x="296" y="158" fill="#7E5109">Zn 4 · sulphate 270</text>
    <text x="296" y="172" fill="#7E5109">Hydrogen sulphide 0.05–0.1 · pH 5–9</text>
    <text x="296" y="186" fill="#7E5109"></text>
    <rect x="532" y="92" width="240" height="96" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="652" y="112" fill="#922B21" font-weight="bold" text-anchor="middle">Bacteriological ⚠</text>
    <text x="548" y="130" fill="#7b241c">1 NO E. coli in 100 ml</text>
    <text x="548" y="144" fill="#7b241c">2 ≤3 coliforms / 100 ml</text>
    <text x="548" y="158" fill="#7b241c">3 ≤5% samples +ve per year</text>
    <text x="548" y="172" fill="#7b241c">4 No 2 consecutive +ve samples</text>
    <text x="548" y="186" fill="#7b241c">5 viruses: no bacteriophages</text>
  </g>

  <text x="28" y="204" font-size="13.5" font-weight="bold" fill="#558B2F">❓ Why coliform = indicator of faecal pollution</text>
  <g font-size="11">
    <rect x="28" y="212" width="180" height="48" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="118" y="231" fill="#1B5E20" font-weight="bold" text-anchor="middle">1 Abundant</text><text x="118" y="248" fill="#2E7D32" text-anchor="middle">always present in gut</text>
    <rect x="216" y="212" width="180" height="48" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="306" y="231" fill="#1B5E20" font-weight="bold" text-anchor="middle">2 Easily detected</text><text x="306" y="248" fill="#2E7D32" text-anchor="middle">even 1/100 ml culture</text>
    <rect x="404" y="212" width="180" height="48" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="494" y="231" fill="#1B5E20" font-weight="bold" text-anchor="middle">3 Survives longer</text><text x="494" y="248" fill="#2E7D32" text-anchor="middle">than pathogens</text>
    <rect x="592" y="212" width="180" height="48" rx="8" fill="#E8F5E9" stroke="#43A047"/><text x="682" y="231" fill="#1B5E20" font-weight="bold" text-anchor="middle">4 More resistant</text><text x="682" y="248" fill="#2E7D32" text-anchor="middle">to purification</text>
  </g>

  <text x="28" y="280" font-size="13.5" font-weight="bold" fill="#558B2F">💨 Air pollution — health effects</text>
  <g font-size="11">
    <rect x="28" y="288" width="240" height="120" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="148" y="308" fill="#922B21" font-weight="bold" text-anchor="middle">⚡ Immediate effects</text>
    <text x="44" y="326" fill="#7b241c">1 Acute bronchitis</text>
    <text x="44" y="340" fill="#7b241c">2 Immediate death by suffocation</text>
    <text x="44" y="354" fill="#7b241c">3 ↑ morbidity &amp; mortality</text>
    <text x="44" y="372" fill="#B03A2E" font-weight="bold">London-type smog disasters!</text>
    <text x="44" y="388" fill="#B03A2E"></text>
    <rect x="280" y="288" width="240" height="120" rx="9" fill="#FDEBD0" stroke="#E67E22"/>
    <text x="400" y="308" fill="#9C640C" font-weight="bold" text-anchor="middle">⏳ Delayed effects</text>
    <text x="296" y="326" fill="#7E5109">1 Chronic bronchitis</text>
    <text x="296" y="340" fill="#7E5109">2 Primary lung cancer 🎗</text>
    <text x="296" y="354" fill="#7E5109">3 Bronchial asthma</text>
    <text x="296" y="372" fill="#7E5109">4 Emphysema</text>
    <text x="296" y="388" fill="#7E5109">5 Respiratory allergies</text>
    <rect x="532" y="288" width="240" height="120" rx="9" fill="#F4ECF7" stroke="#8E44AD"/>
    <text x="652" y="308" fill="#6C3483" font-weight="bold" text-anchor="middle">Other effects 🌱</text>
    <text x="548" y="326" fill="#6C3483">Plants: leaf burns, crop damage</text>
    <text x="548" y="340" fill="#6C3483">Animals: ↑ mortality</text>
    <text x="548" y="354" fill="#6C3483">Social: metal corrosion, odour,</text>
    <text x="548" y="368" fill="#6C3483">reduced visibility</text>
    <text x="548" y="388" fill="#6C3483">🧠 Lead → child IQ ↓</text>
  </g>

  <text x="28" y="424" font-size="13.5" font-weight="bold" fill="#558B2F">🛡 Prevention &amp; control (WHO strategy)</text>
  <g font-size="11">
    <rect x="28" y="432" width="140" height="48" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="98" y="451" fill="#1E8449" font-weight="bold" text-anchor="middle">1 Containment</text><text x="98" y="468" fill="#145A32" text-anchor="middle">enclosure + ventilation</text>
    <rect x="176" y="432" width="140" height="48" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="246" y="451" fill="#1E8449" font-weight="bold" text-anchor="middle">2 Replacement</text><text x="246" y="468" fill="#145A32" text-anchor="middle">non-polluting process</text>
    <rect x="324" y="432" width="140" height="48" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="394" y="451" fill="#1E8449" font-weight="bold" text-anchor="middle">3 Dilution</text><text x="394" y="468" fill="#145A32" text-anchor="middle">self-cleaning capacity</text>
    <rect x="472" y="432" width="140" height="48" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="542" y="451" fill="#1E8449" font-weight="bold" text-anchor="middle">4 Legislation</text><text x="542" y="468" fill="#145A32" text-anchor="middle">control by law</text>
    <rect x="620" y="432" width="152" height="48" rx="8" fill="#EAFAF1" stroke="#27AE60"/><text x="696" y="451" fill="#1E8449" font-weight="bold" text-anchor="middle">5 International</text><text x="696" y="468" fill="#145A32" text-anchor="middle">WHO monitoring network</text>
  </g>

  <rect x="28" y="492" width="744" height="24" rx="7" fill="#F1F8E9"/>
  <text x="46" y="508" font-size="10.5" fill="#33691E">Pollutants: gases (CO₂, CO, SO₂, NOₓ) + particulates (mineral dust, acid mists, tobacco/oil smoke) · Indicators: SO₂, smoke, grit &amp; dust, haze</text>
  <rect x="28" y="524" width="744" height="24" rx="7" fill="#558B2F" fill-opacity="0.08"/>
  <text x="46" y="540" font-size="11.5" font-weight="bold" fill="#33691E">🎯 Water: no E. coli /100 ml, ≤3 coliforms · Coliform = abundant+detectable+long-lived+resistant · Air = contain+replace+dilute+legislate+international</text>
</svg>