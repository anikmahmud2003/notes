<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Arial,'Segoe UI','Noto Sans',sans-serif" role="img" aria-label="Risk factors of breast, lung and cervical cancer">
  <rect width="800" height="560" fill="#ffffff"/>
  <rect width="800" height="70" fill="#1A5276"/>
  <text x="28" y="35" font-size="22" font-weight="bold" fill="#ffffff">Q16 · Risk Factors — Breast, Lung &amp; Cervical Cancer</text>
  <text x="29" y="56" font-size="13" fill="#aed6f1">The big three cancers and their risk profiles 🎀🫁👩‍⚕️</text>

  <g font-size="12">
    <rect x="28" y="90" width="244" height="390" rx="10" fill="#F4ECF7" stroke="#8E44AD" stroke-width="2"/>
    <text x="150" y="114" font-size="14" font-weight="bold" fill="#6C3483" text-anchor="middle">🎀 BREAST</text>
    <text x="44" y="140" fill="#6C3483">• Age 35–50 years ↑ rapid</text>
    <text x="44" y="162" fill="#6C3483">• Family history (+++)</text>
    <text x="44" y="184" fill="#6C3483">• Delayed first pregnancy</text>
    <text x="44" y="206" fill="#6C3483">• Early menarche / late menopause</text>
    <text x="44" y="228" fill="#6C3483">• ↑ oestrogen &amp; progesterone</text>
    <text x="44" y="250" fill="#6C3483">• Prior breast biopsy</text>
    <text x="44" y="272" fill="#6C3483">• High-fat diet &amp; obesity</text>
    <text x="44" y="294" fill="#6C3483">• Higher socio-economic group</text>
    <text x="44" y="316" fill="#6C3483">• Radiation · OCP</text>
    <line x1="44" y1="336" x2="256" y2="336" stroke="#8E44AD" stroke-width="1.5"/>
    <text x="44" y="358" fill="#6C3483" font-weight="bold">Screening:</text>
    <text x="44" y="378" fill="#6C3483">BSE · physician palpation ·</text>
    <text x="44" y="396" fill="#6C3483">thermography · mammography</text>

    <rect x="284" y="90" width="232" height="390" rx="10" fill="#EBF5FB" stroke="#2980B9" stroke-width="2"/>
    <text x="400" y="114" font-size="14" font-weight="bold" fill="#1F618D" text-anchor="middle">🫁 LUNG</text>
    <rect x="300" y="128" width="200" height="70" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="400" y="152" font-size="15" font-weight="bold" fill="#922B21" text-anchor="middle">🚬 Smoking</text>
    <text x="400" y="172" font-size="12" fill="#7b241c" text-anchor="middle">→ 90% of lung-cancer</text>
    <text x="400" y="186" font-size="12" fill="#7b241c" text-anchor="middle">deaths!</text>
    <text x="300" y="222" fill="#21618C">• Air pollution</text>
    <text x="300" y="246" fill="#21618C">• Radioactivity</text>
    <text x="300" y="270" fill="#21618C">• Asbestos exposure</text>
    <text x="300" y="294" fill="#21618C">• Arsenic &amp; chromates</text>
    <line x1="300" y1="314" x2="500" y2="314" stroke="#2980B9" stroke-width="1.5"/>
    <text x="300" y="338" fill="#1F618D" font-weight="bold">Screening:</text>
    <text x="300" y="358" fill="#21618C">Chest radiograph</text>
    <text x="300" y="378" fill="#21618C">sputum cytology</text>
    <line x1="300" y1="398" x2="500" y2="398" stroke="#2980B9" stroke-width="1.5"/>
    <text x="300" y="422" fill="#1F618D" font-weight="bold">Primary prevention:</text>
    <text x="300" y="442" fill="#21618C">control the smoking</text>
    <text x="300" y="460" fill="#21618C">epidemic + legislation</text>

    <rect x="528" y="90" width="244" height="390" rx="10" fill="#FEF9E7" stroke="#F39C12" stroke-width="2"/>
    <text x="650" y="114" font-size="14" font-weight="bold" fill="#9C640C" text-anchor="middle">👩‍⚕️ CERVIX</text>
    <rect x="544" y="128" width="212" height="52" rx="9" fill="#FDECEC" stroke="#C0392B"/>
    <text x="650" y="150" font-size="12.5" font-weight="bold" fill="#922B21" text-anchor="middle">🦠 HPV infection</text>
    <text x="650" y="168" font-size="11.5" fill="#7b241c" text-anchor="middle">= most important cause</text>
    <text x="544" y="200" fill="#7E5109">• Age 25–45 years</text>
    <text x="544" y="222" fill="#7E5109">• Intercourse at early age</text>
    <text x="544" y="244" fill="#7E5109">• Multiple sex partners</text>
    <text x="544" y="266" fill="#7E5109">• High parity</text>
    <text x="544" y="288" fill="#7E5109">• OCP · Smoking</text>
    <text x="544" y="310" fill="#7E5109">• Low socio-economic condition</text>
    <text x="544" y="332" fill="#7E5109">• Uncircumcised male partner</text>
    <text x="544" y="354" fill="#7E5109">• Immunocompromised · CIN</text>
    <line x1="544" y1="374" x2="756" y2="374" stroke="#F39C12" stroke-width="1.5"/>
    <text x="544" y="396" fill="#9C640C" font-weight="bold">Screening:</text>
    <text x="544" y="416" fill="#7E5109">Pap smear / cervical cytology</text>
  </g>

  <rect x="28" y="496" width="744" height="48" rx="10" fill="#1A5276" fill-opacity="0.08"/>
  <text x="46" y="518" font-size="13" font-weight="bold" fill="#154360">🎯 Breast = age 35–50 + family hx + hormones + high-fat diet · Lung = smoking (90%) · Cervix = HPV + early sex + multiple partners</text>
  <text x="46" y="536" font-size="11.5" fill="#1A5276">Screening: BSE/mammography (breast) · CXR/sputum cytology (lung) · Pap smear (cervix)</text>
</svg>